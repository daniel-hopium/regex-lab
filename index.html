<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<script>try{const t=JSON.parse(localStorage.getItem('regex-lab:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{if(JSON.parse(localStorage.getItem('regex-lab:width'))==='wide')document.documentElement.setAttribute('data-width','wide')}catch(e){}
try{const w=JSON.parse(localStorage.getItem('regex-lab:lessonW'));if(w>0)document.documentElement.style.setProperty('--lesson-w',w+'px')}catch(e){}</script>
<title>Regex-Werkstatt – Reguläre Ausdrücke zum Anfassen</title>
<meta name="description" content="Reguläre Ausdrücke live gegen Text: Treffer, Gruppen und Erklärung pro Baustein, dazu Übungen und typische Fallen.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#A3155B; --brand-ink-l:#FFFFFF; --brand-soft-l:#FBE7F0;
  --brand-d:#F9A8D4; --brand-ink-d:#3A0820; --brand-soft-d:#35172A;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
img.logo-mark{background:none;object-fit:contain}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.theme-btn .ic-sun,.theme-btn[aria-pressed="true"] .ic-moon{display:none}
.theme-btn[aria-pressed="true"] .ic-sun{display:block}
.width-btn .ic-narrow,.width-btn[aria-pressed="true"] .ic-wide{display:none}
.width-btn[aria-pressed="true"] .ic-narrow{display:block}
/* Unter 1280px ist „breit“ kaum breiter als normal – dann braucht es den Knopf nicht */
@media (max-width:1279px){.width-btn{display:none}}
/* Breite Ansicht: die Lektion nutzt die ganze Spalte statt 48rem */
:root[data-width="wide"] .lesson{position:relative;max-width:var(--lesson-w,none);padding-left:clamp(16px,3vw,56px);padding-right:clamp(16px,3vw,56px)}
/* Zieh-Griff am rechten Rand der Lektion – nur in der breiten Ansicht */
.lesson-grip{display:none}
:root[data-width="wide"] .lesson-grip{display:block;position:absolute;top:0;bottom:0;right:0;width:14px;cursor:ew-resize;touch-action:none}
.lesson-grip::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--line);transition:background-color .15s}
.lesson-grip span{position:sticky;top:calc(50% - 24px);display:block;width:8px;height:48px;margin-left:3px;border-radius:4px;background:var(--line-strong);transition:background-color .15s}
.lesson-grip:hover::before,.lesson-grip:focus-visible::before,.lesson-grip.is-dragging::before,.lesson-grip:hover span,.lesson-grip:focus-visible span,.lesson-grip.is-dragging span{background:var(--brand)}
.lesson-grip:focus-visible{outline-offset:0}
:root.is-resizing,:root.is-resizing *{cursor:ew-resize!important;user-select:none}
@media (max-width:1279px){:root[data-width="wide"] .lesson-grip{display:none}}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.side-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.start-grid.sisters{margin-top:12px}
.sis-ic{width:24px;height:24px;border-radius:6px;flex:none}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9375rem}
.chips a:hover{background:var(--surface-2)}
.chips a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips .ic{width:18px;height:18px}
.code{margin:0;padding:12px 14px;font:400 .8125rem/1.55 var(--font-mono);overflow-x:auto;white-space:pre;tab-size:2}
.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.count{margin:16px 0 0;font-weight:700;color:var(--muted);min-height:1.5em}
.table{width:100%;border-collapse:collapse;font-size:.9375rem}
.table th,.table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
/* Seitenleiste im Stil einer Doku: Kapitel als Überschrift, Einträge darunter */
.grp{display:block;text-decoration:none}
a.grp:hover{color:var(--brand)}
a.grp[aria-current="page"]{color:var(--brand)}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item code{background:none;padding:0;font-size:.875rem;font-weight:600}
.item.item-page{padding-top:10px;padding-bottom:11px}
@media (pointer:coarse){.items .item{min-height:44px;align-content:center}}
.hdr-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl)}
.hdr-link:hover{background:var(--surface-2)}
.hdr-link .ic{width:18px;height:18px}
@media (max-width:479px){.hdr-long,.hdr-link .ic{display:none}.appbar{flex-wrap:nowrap}}
.xlink::after{content:" ↗"}
a.logo{color:inherit;text-decoration:none;border-radius:var(--radius-sm);padding:2px 8px 2px 2px;margin-left:-2px}
a.logo:hover{background:var(--surface-2)}
.logo-name{display:block}
@media (max-width:479px){.logo-sub{display:none}}

/* ---------- Einträge ---------- */
:root{--tk-k:#8A2BB0;--tk-s:#1B6B40;--tk-n:#A3400B;--tk-c:#6B7280}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tk-k:#D7A8F5;--tk-s:#7BD9A1;--tk-n:#FDBA74;--tk-c:#8B95A5}}
:root[data-theme="dark"]{--tk-k:#D7A8F5;--tk-s:#7BD9A1;--tk-n:#FDBA74;--tk-c:#8B95A5}
.ca-toc{margin-top:20px;position:relative}
.ca-entry{padding:28px 0 32px;border-bottom:1px solid var(--line);scroll-margin-top:16px;position:relative}
.ca-entry.ca-hit{border:2px solid var(--brand);border-radius:var(--radius-lg);padding:22px 16px 26px;margin:12px -16px 0;box-shadow:0 0 0 4px var(--brand-soft)}
.lesson .ca-entry h2{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ca-entry h2 code{font-size:1.125rem}
.ca-sub{font:400 1rem/1.4 var(--font-body);color:var(--muted)}
.ca-desc{margin:8px 0 14px;max-width:68ch}
.ca-desc p{margin:0 0 8px}
.ca-desc p:last-child{margin-bottom:0}
.ca-vals{border:0;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;position:relative}
.ca-vals label{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:.9375rem;font-weight:700}
.ca-vals label:hover{background:var(--surface-2)}
.ca-vals input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ca-vals code{background:none;padding:0;font-size:.8125rem}
.ca-vals label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ca-vals label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.ca-note{margin:10px 0 0;font-size:.9375rem;padding:8px 12px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;max-width:68ch}
.ca-codebox{border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;position:relative}
.ca-hl{background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:3px}
.ca-tip{margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch;position:relative}
.ca-rule{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--success);background:var(--success-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch}
.ca-links{margin:10px 0 0;font-size:.875rem;color:var(--muted)}
.ca-find{margin:8px 0 0;position:relative}
.ca-index td:first-child{font-weight:700}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item .item-title{font-weight:600;font-size:.9375rem}
.btn-sm{min-height:36px;padding:0 12px;font-size:.9375rem}
.btn .ic{width:18px;height:18px}

/* Syntax-Farben */
.tk-k{color:var(--tk-k);font-weight:600}
.tk-s{color:var(--tk-s)}
.tk-n{color:var(--tk-n)}
.tk-c{color:var(--tk-c);font-style:italic}

/* ---------- run: echter Code, eigene Konsole ---------- */
.run-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.run-hint{font-size:.8125rem;color:var(--muted)}
.console{margin-top:10px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.console-h{margin:0;padding:6px 12px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.con-lines{list-style:none;margin:0;padding:6px 0;font:400 .8125rem/1.5 var(--font-mono);min-height:2.6em}
.con-lines:empty::before{content:attr(data-empty);display:block;padding:2px 12px;color:var(--muted);font-style:italic}
.con-lines li{display:flex;gap:10px;padding:2px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:pre-wrap;overflow-wrap:anywhere}
.con-lines li:last-child{border-bottom:0}
.con-t{flex:none;min-width:5.5ch;text-align:right;color:var(--muted)}
.con-warn{background:var(--warn-bg);color:var(--warn)}
.con-error{background:var(--danger-bg);color:var(--danger)}

/* ---------- trace: Event Loop Schritt für Schritt ---------- */
.tr{display:grid;gap:12px}
@container (min-width:44rem){.tr{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.tr-note,.tr-bar{grid-column:1/-1}}
.tr-code .code{padding:10px 0}
.tr-code .ln{display:block;padding:0 14px 0 0;border-left:4px solid transparent}
.tr-code .ln::before{content:attr(data-n);display:inline-block;width:3ch;margin-right:12px;text-align:right;color:var(--muted);opacity:.7}
.tr-code .ln.is-cur{background:var(--brand-soft);border-left-color:var(--brand)}
.tr-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tr-box{border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:6px 8px 8px;min-height:84px;min-width:0}
.tr-box h3{margin:0 0 6px;font:700 .75rem/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr-box ol,.tr-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tr-stack ol{flex-direction:column-reverse}
.tr-box li{font:500 .8125rem/1.35 var(--font-mono);padding:4px 8px;border-radius:6px;background:var(--surface-2);overflow-wrap:anywhere}
.tr-box li.is-new{background:var(--brand);color:var(--brand-ink)}
.tr-out{grid-column:1/-1}
.tr-out ol{flex-direction:row;flex-wrap:wrap}
.tr-micro{border-color:color-mix(in srgb,var(--success) 45%,var(--line))}
.tr-task{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tr-note{margin:0;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-2);min-height:3.2em;max-width:none}
.tr-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tr-pos{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto;min-width:12ch}

/* ---------- sim: Regler rein, Ergebnis raus ---------- */
.sim-ctl{display:grid;gap:12px;margin-bottom:14px}
.sim-f{border:0;margin:0;padding:0;min-width:0}
.sim-f legend,.sim-lbl{font-weight:700;font-size:.9375rem;margin-bottom:6px;padding:0}
.sim-f .ca-vals{margin:0}
.sim-range{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px}
.sim-range .sim-lbl{grid-column:1/-1;margin:0}
.sim-range input{width:100%;accent-color:var(--brand)}
.sim-range output{font:700 .875rem/1 var(--font-mono);min-width:8ch;text-align:right}
.sim-checks{display:flex;flex-wrap:wrap;gap:0 18px}
.sim-checks .check-row{min-height:36px}
.verdict{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:700;line-height:1.4}
.verdict .ic{margin-top:1px}
.v-ok{background:var(--success-bg);color:var(--success)}
.v-bad{background:var(--danger-bg);color:var(--danger)}
.v-warn{background:var(--warn-bg);color:var(--warn)}
.v-info{background:var(--brand-soft);color:var(--brand)}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.pane{margin:0;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;min-width:0}
.pane figcaption{padding:6px 12px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.pane .code{white-space:pre-wrap;overflow-wrap:anywhere}
.flow{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;counter-reset:fl}
.flow li{counter-increment:fl;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1.5px solid var(--line);font-size:.9375rem}
.flow li::before{content:counter(fl);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font:700 .75rem/1 var(--font-mono)}
.flow .fl-ok{border-color:color-mix(in srgb,var(--success) 50%,var(--line))}
.flow .fl-ok::before{background:var(--success);color:var(--surface)}
.flow .fl-bad{border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.flow .fl-bad::before{background:var(--danger);color:var(--surface)}
.flow .fl-warn::before{background:var(--warn);color:var(--surface)}
.flow .fl-off{opacity:.55}
.sim-extra{margin-top:12px}

/* ---------- custom: freie Demos ---------- */
.stage{position:relative;padding:16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--surface)}
.stage+.console{margin-top:10px}
.stage-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stage-row+.stage-row{margin-top:10px}
.meter{font:700 1.5rem/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.meter small{display:block;font:400 .8125rem/1.3 var(--font-body);color:var(--muted)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.meters>div{padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.kv dt{font-weight:700}
.kv dd{margin:0;font-family:var(--font-mono);font-size:.8125rem;overflow-wrap:anywhere}

/* ---------- Wasserfall ---------- */
/* Wasserfall: eine Zeile pro Anfrage, farbige Phasen auf einer Zeitachse */
.wf{display:grid;gap:6px;font-size:.8125rem}
.wf-row{display:grid;grid-template-columns:minmax(64px,9rem) minmax(0,1fr) auto;gap:10px;align-items:center}
.wf-lbl{font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-track{position:relative;height:18px;border-radius:4px;background:var(--surface-2)}
.wf-seg{position:absolute;top:0;bottom:0;min-width:2px}
.wf-seg:first-child{border-radius:4px 0 0 4px}
.wf-seg:last-child{border-radius:0 4px 4px 0}
.wf-t{font:600 .75rem/1 var(--font-mono);color:var(--muted);min-width:6ch;text-align:right}
.wf-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;padding:0;list-style:none;font-size:.8125rem;color:var(--muted)}
.wf-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ph-dns{background:#0E9F8E}.ph-tcp{background:#E07B00}.ph-tls{background:#8B5CF6}.ph-wait{background:#64748B}.ph-ttfb{background:#16A34A}.ph-dl{background:#2563EB}.ph-parse{background:#C026D3}.ph-exec{background:#DB2777}.ph-render{background:#CA8A04}.ph-block{background:#DC2626}
.wf-total{margin:10px 0 0;font-weight:700}


/* ---------- Regex-Werkstatt ---------- */
/* Regex-Tester */
.rx{display:grid;gap:10px}
.rx-line{display:flex;align-items:stretch;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden}
.rx-line:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.rx-sl{display:grid;place-items:center;padding:0 8px;font:700 1.125rem/1 var(--font-mono);color:var(--muted);background:var(--surface-2)}
.rx-src{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 1rem/1.4 var(--font-mono);padding:10px;outline:none}
.rx-fl{width:5.5ch;border:0;border-left:1.5px solid var(--line);background:var(--surface-2);color:var(--brand);font:700 1rem/1 var(--font-mono);padding:0 8px;outline:none}
.rx-flags{display:flex;flex-wrap:wrap;gap:6px}
.rx-flag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:.8125rem;cursor:pointer;background:var(--surface)}
.rx-flag input{margin:0;accent-color:var(--brand)}
.rx-flag b{font-family:var(--font-mono)}
.rx-flag:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.rx-text,.rx-repl{width:100%;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:500 .9375rem/1.55 var(--font-mono);padding:10px;resize:vertical}
.rx-repl{resize:none}
.rx-err{margin:0;padding:8px 12px;border-radius:var(--radius-sm);background:var(--danger-bg,#fde8e8);color:var(--danger);font:600 .875rem/1.4 var(--font-mono)}
.rx-view{margin:0;padding:12px;border-radius:var(--radius-sm);background:var(--surface-2);font:500 .9375rem/1.9 var(--font-mono);white-space:pre-wrap;word-break:break-word;min-height:3em}
.rx-view mark{color:inherit;border-radius:3px;padding:1px 0;box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 55%,transparent)}
.rx-m0{background:color-mix(in srgb,var(--brand) 26%,transparent)}
.rx-m1{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.rx-zero{display:inline-block;width:2px;height:1.2em;vertical-align:-.2em;background:var(--brand);margin:0 1px}
.rx-gr{border-bottom:2.5px solid;padding-bottom:1px}
.rx-g1{border-color:#D97706}.rx-g2{border-color:#2563EB}.rx-g3{border-color:#16A34A}.rx-g4{border-color:#9333EA}
.rx-sum{margin:0;font-weight:700;font-size:.9375rem}
.rx-sum small{font-weight:400;color:var(--muted)}
.rx-tbl-wrap{overflow-x:auto}
.rx-tbl{border-collapse:collapse;font-size:.8125rem;min-width:100%}
.rx-tbl th,.rx-tbl td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rx-tbl td{font-family:var(--font-mono)}
.rx-tbl .nil{color:var(--muted);font-family:inherit}
.rx-tbl th .sw{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
.rx-res{margin:0;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px dashed var(--line-strong);font:500 .9375rem/1.6 var(--font-mono);white-space:pre-wrap;word-break:break-word}
.rx-sub{font:700 .75rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 -4px}

/* Erklärung Baustein für Baustein */
.rx-explain>summary{cursor:pointer;font-weight:700;padding:4px 0}
.rx-color{font:600 1rem/1.6 var(--font-mono);padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);word-break:break-all;margin:6px 0}
.rx-tree{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rx-tree li{display:grid;grid-template-columns:minmax(4.5rem,max-content) 1fr;gap:12px;align-items:baseline;padding:4px 6px 4px calc(6px + var(--d,0) * 18px);border-radius:6px;font-size:.875rem}
.rx-tree li:nth-child(odd){background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.rx-tree code{font:700 .875rem/1.4 var(--font-mono);word-break:break-all}
.rx{--c-esc:#B45309;--c-cls:#2563EB;--c-q:#C026D3;--c-g:#16A34A;--c-a:#DC2626;--c-ref:#0891B2}
:root[data-theme="dark"] .rx,:root[data-theme="dark"] .bt-pat{--c-esc:#FBBF24;--c-cls:#93C5FD;--c-q:#F0ABFC;--c-g:#86EFAC;--c-a:#FCA5A5;--c-ref:#67E8F9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rx{--c-esc:#FBBF24;--c-cls:#93C5FD;--c-q:#F0ABFC;--c-g:#86EFAC;--c-a:#FCA5A5;--c-ref:#67E8F9}}
.rx-lit{color:var(--ink)}.rx-esc{color:var(--c-esc)}.rx-cls{color:var(--c-cls)}.rx-q{color:var(--c-q)}.rx-g{color:var(--c-g)}.rx-a,.rx-alt{color:var(--c-a)}.rx-ref{color:var(--c-ref)}

/* Chips für Beispielmuster */
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{min-height:32px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 .8125rem/1 var(--font-mono);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.presets button:hover{background:var(--surface-2)}
.presets button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}

/* Übungen */
.ex-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-dots{display:flex;gap:6px;flex-wrap:wrap}
.ex-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:700 .8125rem/1 var(--font-mono);cursor:pointer}
.ex-dot[aria-current="step"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.ex-dot.solved{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ex-q{margin:0;font-size:1rem;line-height:1.55}
.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ex-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:6px;border:1.5px solid var(--line);font-size:.875rem}
.ex-list li code{font:500 .875rem/1.4 var(--font-mono);white-space:pre-wrap;word-break:break-all}
.ex-list li.ok{border-color:color-mix(in srgb,var(--success) 50%,var(--line))}
.ex-list li.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.ex-list .want{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.ex-list .got{font-weight:700;white-space:nowrap}
.ex-list li.ok .got{color:var(--success)}
.ex-list li.bad .got{color:var(--danger)}
.ex-done{margin:0;padding:10px 12px;border-radius:var(--radius-sm);background:var(--brand-soft);font-weight:700}
.ex-btns{display:flex;flex-wrap:wrap;gap:8px}
.ex-sol{margin:0;font:600 .9375rem/1.5 var(--font-mono);padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);word-break:break-all}

/* Backtracking-Schritte */
.bt-text,.bt-pat{display:flex;flex-wrap:wrap;gap:2px;font:600 1.0625rem/1 var(--font-mono)}
.bt-text span,.bt-pat span{min-width:1.45em;padding:7px 3px;text-align:center;border-radius:5px;background:var(--surface-2);border:1.5px solid transparent;white-space:pre}
.bt-text span.in{background:color-mix(in srgb,var(--brand) 22%,var(--surface))}
.bt-text span.cur{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.bt-text span.start{border-left:3px solid var(--warn)}
.bt-pat span.on{background:var(--brand);color:var(--brand-ink)}
.bt-pat span.fail{background:var(--danger);color:#fff}
.bt-note{margin:0;min-height:3em;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);font-size:.9375rem}
.bt-note.ok{border-left:4px solid var(--success)}.bt-note.fail{border-left:4px solid var(--danger)}.bt-note.back{border-left:4px solid var(--warn)}
.bt-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bt-ctl input[type=range]{flex:1;min-width:160px}
.bt-lbl{font:700 .75rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 4px}

/* ReDoS-Messung */
.rd-bars{display:grid;gap:4px}
.rd-bar{display:grid;grid-template-columns:4.5rem 1fr 6rem;gap:8px;align-items:center;font:500 .8125rem/1 var(--font-mono)}
.rd-track{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.rd-fill{height:100%;background:var(--brand)}
.rd-bar.slow .rd-fill{background:var(--danger)}
.rd-bar.dead .rd-fill{background:repeating-linear-gradient(45deg,var(--danger),var(--danger) 6px,transparent 6px,transparent 12px)}

/* Spickzettel */
.cs{width:100%;border-collapse:collapse;font-size:.875rem}
.cs th,.cs td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cs th[scope=rowgroup]{padding-top:14px;font:700 .75rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cs button{font:700 .875rem/1.3 var(--font-mono);padding:4px 8px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.cs button:hover{background:var(--brand-soft);border-color:var(--brand)}
.cs td:last-child{font-family:var(--font-mono);font-size:.8125rem;color:var(--muted)}
</style>
</head>

function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);

  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;

  }

  t.append(closeBtn);

  t.append(timer);

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}

    if(closed)return;closed=true;clearTimeout(id);

    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} ${tx('mit Strg plus Z','with Ctrl plus Z')}.`:''),type==='error');
  return close;
}

}catch(err){r.err=String(err.message||err)}postMessage(r)};`;

   const show=i=>{cur=i;const tk=o.tasks[i];$('.ex-q',wg).innerHTML=`<b>${tx('Aufgabe','Task')} ${i+1}:</b> ${tk.q}`;src.value=store.get('try:'+o.id+':'+i,'');fl.value=tk.f??'';$('.ex-hint-t',wg).hidden=true;$('.ex-sol',wg).hidden=true;dots();check()};
   const check=async()=>{
    const tk=o.tasks[cur],s=src.value,f=fl.value.replace(/[^dgimsuvy]/g,''),my=++gen;store.set('try:'+o.id+':'+cur,s);
    const all=[...tk.yes.map(x=>[x,true]),...tk.no.map(x=>[x,false])];
    const e=s?compileErr(s,f):null;$('.rx-err',wg).hidden=!e;if(e)$('.rx-err',wg).textContent=e;
    let res=null;
    if(s&&!e){const r=await RX({op:'test',src:s,flags:f,list:all.map(a=>a[0])});if(my!==gen)return;if(r.timeout){$('.rx-err',wg).hidden=false;$('.rx-err',wg).textContent=tx('Zu langsam – katastrophales Backtracking?','Too slow – catastrophic backtracking?')}else res=r.t}

    if(okAll){done.textContent=tx('Gelöst! Alle Zeilen stimmen.','Solved! Every line is right.')+(tk.note?' '+tk.note:'');const sv=solved();if(!sv[o.id+':'+cur]){sv[o.id+':'+cur]=1;store.set(KEY,sv);dots()}}
   };
   $('.ex-dots',wg).addEventListener('click',e=>{const b=e.target.closest('.ex-dot');if(b)show(+b.dataset.i)});
   wg.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(check,150)});
   $('.ex-hint',wg).addEventListener('click',()=>{const h=$('.ex-hint-t',wg);h.hidden=false;h.innerHTML=o.tasks[cur].hint});
   $('.ex-show',wg).addEventListener('click',()=>{const p=$('.ex-sol',wg),tk=o.tasks[cur];p.hidden=false;p.innerHTML=`/${colorRx(lex(tk.sol,tk.f||''))}/${esc(tk.f||'')}`});
   $('.ex-next',wg).addEventListener('click',()=>show((cur+1)%o.tasks.length));
   show(0);
   return ()=>clearTimeout(timer);
  }};
}

/* ---------- Mini-Engine für den Schritt-Modus ---------- */
/* Unterstützt: Zeichen, ., [Klassen], \d \w \s (und Großbuchstaben), Gruppen (auch (?:)), |, * + ? {n,m} (gierig und genügsam), ^ $. */
function btParse(src){
  let i=0;
  const fail=m=>{throw new Error(m)};
  const atom=()=>{
    const a=i,c=src[i];
    if(c==='('){i++;let cap=true;if(src.startsWith('?:',i)){i+=2;cap=false}else if(src[i]==='?')fail(tx('Lookarounds kann der Schritt-Modus nicht.','Step mode does not support lookarounds.'));const n=alt();if(src[i]!==')')fail(tx('Klammer fehlt','missing parenthesis'));i++;return {t:'grp',n,a,b:i,cap}}
    if(c==='['){let j=i+1,neg=false;if(src[j]==='^'){neg=true;j++}const set=[];while(j<src.length&&src[j]!==']'){let x=src[j];if(x==='\\'){x=src[j+1];if('dws'.includes(x.toLowerCase())){set.push(['sh',x]);j+=2;continue}j++}if(src[j+1]==='-'&&src[j+2]&&src[j+2]!==']'){let y=src[j+2],k=j+3;if(y==='\\'){y=src[j+3];k++}set.push(['r',x,y]);j=k}else{set.push(['c',x]);j++}}if(src[j]!==']')fail(tx('] fehlt','missing ]'));i=j+1;return {t:'set',neg,set,a,b:i}}
    if(c==='\\'){const n=src[i+1];if(n==null)fail('\\');i+=2;if('dDwWsS'.includes(n))return {t:'sh',c:n,a,b:i};if(/[1-9bBk]/.test(n))fail(tx('Rückverweise und \\b kann der Schritt-Modus nicht.','Step mode does not support backreferences and \\b.'));return {t:'ch',c:({n:'\n',t:'\t'})[n]||n,a,b:i}}
    if(c==='.'){i++;return {t:'any',a,b:i}}
    if(c==='^'||c==='$'){i++;return {t:c==='^'?'bol':'eol',a,b:i}}
    if(c==null||c===')'||c==='|')fail(tx('Unerwartetes Ende','unexpected end'));
    if('*+?'.includes(c))fail(tx('Quantor ohne etwas davor','quantifier without anything before it'));
    i++;return {t:'ch',c,a,b:i};
  };
  const term=()=>{
    const at=atom();const c=src[i];let min,max;
    if(c==='*'){min=0;max=Infinity;i++}else if(c==='+'){min=1;max=Infinity;i++}else if(c==='?'){min=0;max=1;i++}
    else if(c==='{'){const m=/^\{(\d+)(,(\d*))?\}/.exec(src.slice(i));if(m){min=+m[1];max=m[2]?(m[3]===''?Infinity:+m[3]):min;i+=m[0].length}}
    if(min==null)return at;
    let lazy=false;if(src[i]==='?'){lazy=true;i++}
    return {t:'rep',n:at,min,max,lazy,a:at.a,b:i,qa:at.b};
  };
  const seq=()=>{const a=i,list=[];while(i<src.length&&src[i]!=='|'&&src[i]!==')')list.push(term());return {t:'seq',list,a,b:i}};
  const alt=()=>{const a=i,opts=[seq()];while(src[i]==='|'){i++;opts.push(seq())}return opts.length>1?{t:'alt',opts,a,b:i}:opts[0]};
  const r=alt();if(i<src.length)fail(tx('Unerwartete )','unexpected )'));return r;
}
function btRun(src,text,limit=3000){
  const root=btParse(src),steps=[];let start=0;
  const log=(pos,node,kind,note)=>{steps.push({pos,start,a:node?node.a:0,b:node?node.b:0,kind,note});if(steps.length>limit)throw {limit:true}};
  const shOk=(c,ch)=>{const t={d:/\d/,w:/\w/,s:/\s/}[c.toLowerCase()].test(ch);return c===c.toLowerCase()?t:!t};
  const one=(n,ch)=>{if(ch==null)return false;if(n.t==='ch')return ch===n.c;if(n.t==='any')return ch!=='\n';if(n.t==='sh')return shOk(n.c,ch);if(n.t==='set'){const hit=n.set.some(s=>s[0]==='c'?s[1]===ch:s[0]==='r'?ch>=s[1]&&ch<=s[2]:shOk(s[1],ch));return n.neg?!hit:hit}};
  const show=ch=>ch==null?tx('Textende','end of text'):`„${ch==='\n'?'\\n':ch===' '?'␣':esc(ch)}“`;
  const m=(n,pos,k)=>{
    switch(n.t){
      case 'ch':case 'any':case 'sh':case 'set':{const ch=text[pos];if(one(n,ch)){log(pos,n,'ok',tx(`<code>${esc(src.slice(n.a,n.b))}</code> passt auf ${show(ch)}`,`<code>${esc(src.slice(n.a,n.b))}</code> matches ${show(ch)}`));return k(pos+1)}log(pos,n,'fail',tx(`<code>${esc(src.slice(n.a,n.b))}</code> passt nicht auf ${show(ch)}`,`<code>${esc(src.slice(n.a,n.b))}</code> does not match ${show(ch)}`));return false}
      case 'bol':{if(pos===0){log(pos,n,'ok',tx('^ – wir stehen am Anfang','^ – we are at the start'));return k(pos)}log(pos,n,'fail',tx('^ – hier ist nicht der Anfang','^ – this is not the start'));return false}
      case 'eol':{if(pos===text.length){log(pos,n,'ok',tx('$ – wir stehen am Ende','$ – we are at the end'));return k(pos)}log(pos,n,'fail',tx('$ – hier ist noch nicht das Ende','$ – this is not the end yet'));return false}
      case 'seq':{const go=(j,p)=>j===n.list.length?k(p):m(n.list[j],p,p2=>go(j+1,p2));return go(0,pos)}
      case 'grp':return m(n.n,pos,k);
      case 'alt':{for(let j=0;j<n.opts.length;j++){const o=n.opts[j];log(pos,o,'try',tx(`Probiere Alternative ${j+1}: <code>${esc(src.slice(o.a,o.b))||'(leer)'}</code>`,`Trying alternative ${j+1}: <code>${esc(src.slice(o.a,o.b))||'(empty)'}</code>`));if(m(o,pos,k))return true;if(j<n.opts.length-1)log(pos,o,'back',tx(`Alternative ${j+1} scheitert – zurück, nächste Alternative`,`Alternative ${j+1} fails – back, next alternative`))}return false}
      case 'rep':{
        const qs=src.slice(n.qa,n.b),body={a:n.a,b:n.b};
        const rep=(cnt,p)=>{
          // took: das Atom hat hier noch einmal gepasst – scheitert der Rest, gibt der Quantor dieses Zeichen wieder ab
          let took=false;
          const more=()=>cnt<n.max&&m(n.n,p,p2=>{took=true;return p2===p?false:rep(cnt+1,p2)});
          const done=()=>{if(cnt<n.min)return false;return k(p)};
          if(n.lazy){if(cnt>=n.min){log(p,body,'try',tx(`<code>${esc(qs)}</code> genügsam: erst mal mit ${cnt}× weitermachen`,`<code>${esc(qs)}</code> lazy: first carry on with ${cnt}×`));if(done())return true;if(cnt<n.max)log(p,body,'back',tx(`Hat nicht gereicht – doch noch ein ${cnt+1}. Mal versuchen`,`Not enough – try a ${cnt+1}th time after all`))}return more()}
          if(more())return true;
          if(took&&cnt>=n.min){log(p,body,'back',tx(`Backtracking: <code>${esc(src.slice(n.a,n.b))}</code> gibt ein Zeichen zurück und nimmt nur ${cnt}×`,`Backtracking: <code>${esc(src.slice(n.a,n.b))}</code> gives back a character and only takes ${cnt}×`))}
          return done();
        };
        return rep(0,pos);
      }
    }
  };
  let found=null;
  try{
    for(start=0;start<=text.length;start++){
      log(start,root,'start',start===0?tx('Start an Position 0','Starting at position 0'):tx(`Kein Treffer ab Position ${start-1} – die Engine rückt eine Stelle weiter und beginnt von vorn`,`No match from position ${start-1} – the engine moves one position on and starts over`));
      if(m(root,start,p=>{found=[start,p];return true}))break;
    }
  }catch(e){if(e&&e.limit)return {steps,limit:true};throw e}
  steps.push({pos:found?found[1]:text.length,start:found?found[0]:start,a:0,b:0,kind:found?'done':'none',note:found?tx(`Treffer: „${esc(text.slice(found[0],found[1]))}“ nach ${steps.length} Schritten`,`Match: “${esc(text.slice(found[0],found[1]))}” after ${steps.length} steps`):tx(`Kein Treffer nach ${steps.length} Schritten`,`No match after ${steps.length} steps`),found});
  return {steps};
}

  const build=()=>{
   stop();const err=$('.rx-err',wg);
   try{run=btRun(srcI.value,txtI.value);err.hidden=true}catch(e){run=null;err.hidden=false;err.textContent=tx('Nicht unterstützt: ','Not supported: ')+e.message;$('.bt-pat',wg).innerHTML='';$('.bt-text',wg).innerHTML='';$('.bt-note',wg).textContent='';return}
   if(run.limit){err.hidden=false;err.textContent=tx(`Mehr als 3000 Schritte – abgebrochen. Genau so sieht katastrophales Backtracking aus.`,`More than 3000 steps – stopped. That’s exactly what catastrophic backtracking looks like.`)}
   k=0;rng.max=run.steps.length-1;$('.bt-steps',wg).textContent=run.steps.length+(run.limit?'+':'');$('.bt-backs',wg).textContent=run.steps.filter(s=>s.kind==='back').length;draw();
  };
  $('.presets',wg).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;srcI.value=b.dataset.p;txtI.value=b.dataset.t;build()});
  srcI.addEventListener('input',build);txtI.addEventListener('input',build);
  rng.addEventListener('input',()=>{k=+rng.value;draw()});
  $('.bt-prev',wg).addEventListener('click',()=>{stop();if(run&&k>0){k--;draw()}});
  $('.bt-next',wg).addEventListener('click',()=>{stop();if(run&&k<run.steps.length-1){k++;draw()}});
  play.addEventListener('click',()=>{if(timer){stop();return}if(!run)return;if(k>=run.steps.length-1)k=0;play.setAttribute('aria-pressed','true');$('span',play).textContent=tx('Anhalten','Pause');timer=setInterval(()=>{if(k>=run.steps.length-1){stop();return}k++;draw()},reducedMotion()?900:450)});
  build();
  return stop;
 },
 tip:tx('Vergleiche <code>&lt;.+&gt;</code> und <code>&lt;.+?&gt;</code>: Die gierige Variante rennt bis zum Textende und muss Zeichen für Zeichen zurück. Die genügsame tastet sich vorwärts. Bei <code>(a+)+b</code> explodiert die Zahl der Schritte schon mit vier Zeichen.','Compare <code>&lt;.+&gt;</code> and <code>&lt;.+?&gt;</code>: the greedy one runs to the end of the text and has to go back character by character. The lazy one feels its way forward. With <code>(a+)+b</code> the step count explodes with just four characters.')},

/* ---------- Grundlagen ---------- */
T({id:'literal',cat:'basics',title:tx('Text und Sonderzeichen','Text and special characters'),sub:tx('Was escapt werden muss','What needs escaping'),keys:'literal escape metacharacter backslash dot special characters',
 desc:tx(R`<p>Die meisten Zeichen stehen für sich selbst. Zwölf haben eine Sonderbedeutung: <code>. * + ? ^ $ { } ( ) | [ ] \</code> (und <code>/</code> im Literal). Willst du sie wörtlich, stellst du einen Backslash davor.</p>`,R`<p>Most characters stand for themselves. Twelve have a special meaning: <code>. * + ? ^ $ { } ( ) | [ ] \</code> (and <code>/</code> in a literal). If you want them literally, put a backslash in front.</p>`),
 rx:{p:'3.50',f:'g',text:tx('Preis: 3.50 € (inkl. MwSt.)\nAlt: 3x50 – Code 3-50 – Version 3.5.0','Price: 3.50 € (incl. VAT)\nOld: 3x50 – code 3-50 – version 3.5.0'),presets:[['3.50','3.50'],[R`3\.50`,R`3\.50`],[R`\(inkl\. MwSt\.\)`,R`\(inkl\. MwSt\.\)`],['(inkl. MwSt.)','(inkl. MwSt.)']]},
 tip:tx('<code>3.50</code> trifft auch „3x50“ und „3-50“ – der Punkt steht für jedes Zeichen. Der Fehler fällt im Test oft nicht auf, weil der echte Punkt ja auch passt.','<code>3.50</code> also matches “3x50” and “3-50” – the dot stands for any character. The bug often goes unnoticed in tests because the real dot matches too.'),
 links:[MDN_RX('Character_escape')]}),

T({id:'dot',cat:'basics',title:tx('Der Punkt','The dot'),sub:tx('Joker für ein Zeichen','Wildcard for one character'),keys:'dot wildcard any character newline dotall',
 desc:tx('<p>Der Punkt steht für <b>genau ein</b> beliebiges Zeichen – außer einem Zeilenumbruch. Mit dem Flag <code>s</code> trifft er auch den.</p>','<p>The dot stands for <b>exactly one</b> arbitrary character – except a line break. With the <code>s</code> flag it matches that too.</p>'),
 rx:{p:'h.t',f:'g',text:'hat hut hit h t hoot h\nt Hut',presets:[['h.t','h.t'],['h..t','h..t'],[tx('h.t mit s','h.t with s'),'h.t','gs'],[tx('h.t mit i','h.t with i'),'h.t','gi']]},
 links:[MDN_RX('Wildcard')]}),

T({id:'classes',cat:'basics',title:tx('Zeichenklassen','Character classes'),sub:'[abc] [a-z] [^…]',keys:'character class set range negated bracket',
 desc:tx('<p>Eckige Klammern stehen für <b>ein</b> Zeichen aus einer Auswahl. Mit Bindestrich gibst du Bereiche an, mit <code>^</code> am Anfang drehst du die Auswahl um. Innerhalb der Klammern verlieren die meisten Sonderzeichen ihre Bedeutung: <code>[.]</code> ist ein echter Punkt.</p>','<p>Square brackets stand for <b>one</b> character from a selection. A hyphen gives ranges, a <code>^</code> at the start inverts the selection. Inside the brackets most special characters lose their meaning: <code>[.]</code> is a literal dot.</p>'),
 rx:{p:'gr[ae]y',f:'g',text:tx('grau, Grau, grey, gray, GREY, gruy\nHex: #1f2e3d #XYZ #ABC','grau, Grau, grey, gray, GREY, gruy\nHex: #1f2e3d #XYZ #ABC'),presets:[['gr[ae]y','gr[ae]y'],['[Gg]r[ae][uy]','[Gg]r[ae][uy]'],['#[0-9a-fA-F]+','#[0-9a-fA-F]+'],['[^a-z ,\\n#]+',R`[^a-z ,\n#]+`],['[a-zA-ZäöüÄÖÜß]+','[a-zA-ZäöüÄÖÜß]+']]},
 tip:tx('Der Bindestrich ist nur zwischen zwei Zeichen ein Bereich. Soll er selbst gemeint sein, stell ihn an den Anfang oder ans Ende: <code>[-+*/]</code>.','The hyphen is only a range between two characters. If you mean the hyphen itself, put it first or last: <code>[-+*/]</code>.'),
 links:[MDN_RX('Character_class')]}),

T({id:'shorthand',cat:'basics',title:tx('Kurzschreibweisen','Shorthand classes'),sub:R`\d \w \s`,keys:'shorthand digit word whitespace \\d \\w \\s',
 desc:tx(R`<p>Für häufige Klassen gibt es Abkürzungen: <code>\d</code> = Ziffer, <code>\w</code> = Wortzeichen, <code>\s</code> = Leerraum. Großgeschrieben bedeuten sie das Gegenteil.</p>`,R`<p>Common classes have shorthands: <code>\d</code> = digit, <code>\w</code> = word character, <code>\s</code> = whitespace. Uppercase means the opposite.</p>`),
 rx:{p:R`\w+`,f:'g',text:tx('Bestellung #4711 am 03.11.2026 für Jürgen Größl – 2 × Kaffee\tfertig','Order #4711 on 03.11.2026 for Jürgen Größl – 2 × coffee\tdone'),presets:[[R`\d+`,R`\d+`],[R`\w+`,R`\w+`],[R`\s+`,R`\s+`],[R`\D+`,R`\D+`],[R`\S+`,R`\S+`],[R`[\p{L}\d]+ (u)`,R`[\p{L}\d]+`,'gu']]},
 tip:tx(R`<code>\w</code> kennt nur ASCII: In „Jürgen“ bricht der Treffer am „ü“ ab, „Größl“ zerfällt in drei Teile. Für deutsche Texte <code>[\p{L}\d_]</code> mit Flag <code>u</code>.`,R`<code>\w</code> only knows ASCII: in “Jürgen” the match stops at “ü”, “Größl” falls apart into three pieces. For international text use <code>[\p{L}\d_]</code> with flag <code>u</code>.`),
 links:[MDN_RX('Character_class_escape')]}),

T({id:'anchors',cat:'basics',title:tx('Anker','Anchors'),sub:R`^ $ \b`,keys:'anchor start end word boundary caret dollar multiline',
 desc:tx(R`<p>Anker treffen kein Zeichen, sondern eine <b>Stelle</b>: <code>^</code> den Anfang, <code>$</code> das Ende, <code>\b</code> eine Wortgrenze. Ohne Anker sucht die Regex irgendwo im Text – der häufigste Grund, warum eine Validierung Unsinn durchlässt.</p>`,R`<p>Anchors don’t match a character but a <b>position</b>: <code>^</code> the start, <code>$</code> the end, <code>\b</code> a word boundary. Without anchors the regex searches anywhere in the text – the most common reason a validation lets nonsense through.</p>`),
 rx:{p:R`\bcat\b`,f:'g',text:'cat category concat bobcat\ncat\nthe cat sat',presets:[['cat','cat'],[R`\bcat\b`,R`\bcat\b`],['^cat','^cat'],['^cat (m)','^cat','gm'],['cat$','cat$'],['sat$ (m)','sat$','gm'],[R`\Bcat\B`,R`\Bcat\B`]]},
 rule:tx('Eine Validierung braucht fast immer <code>^…$</code>. Sonst ist „abc123xyz“ eine gültige Zahl, weil irgendwo „123“ drinsteht.','A validation almost always needs <code>^…$</code>. Otherwise “abc123xyz” is a valid number because “123” is in there somewhere.'),
 links:[MDN_RX('Input_boundary_assertion'),MDN_RX('Word_boundary_assertion')]}),

T({id:'alternation',cat:'basics',title:tx('Alternativen','Alternation'),sub:'a|b',keys:'alternation or pipe precedence order',
 desc:tx('<p>Der senkrechte Strich heißt „oder“. Er bindet schwächer als alles andere: <code>^a|b$</code> heißt „(^a) oder (b$)“, nicht „^(a|b)$“. Und die Engine nimmt die <b>erste</b> Alternative, die passt – nicht die längste.</p>','<p>The vertical bar means “or”. It binds weaker than everything else: <code>^a|b$</code> means “(^a) or (b$)”, not “^(a|b)$”. And the engine takes the <b>first</b> alternative that fits – not the longest.</p>'),
 rx:{p:'Kat|Katze',f:'g',text:tx('Katze, Kater, Katalog, Hund, Hundehütte','Katze, Kater, Katalog, Hund, Hundehütte'),presets:[['Kat|Katze','Kat|Katze'],['Katze|Kat','Katze|Kat'],[R`\b(?:Katze|Hund)\b`,R`\b(?:Katze|Hund)\b`],[R`\bKatze|Hund\b`,R`\bKatze|Hund\b`],[R`\bKat(?:ze|er)?\b`,R`\bKat(?:ze|er)?\b`]]},
 tip:tx('<code>Kat|Katze</code> findet in „Katze“ nur „Kat“: Die erste Alternative passt schon, also hört die Engine auf. Längere Alternativen gehören nach vorn.','<code>Kat|Katze</code> only finds “Kat” in “Katze”: the first alternative already fits, so the engine stops. Longer alternatives go first.'),
 links:[MDN_RX('Disjunction')]}),

/* ---------- Quantoren ---------- */
T({id:'quantifiers',cat:'quant',title:tx('Wie oft?','How often?'),sub:'* + ? {n,m}',keys:'quantifier star plus question mark braces repetition optional',
 desc:tx('<p>Ein Quantor gilt für das <b>eine</b> Ding direkt davor – ein Zeichen, eine Klasse oder eine Gruppe. <code>ab+</code> heißt „a, dann mindestens ein b“, nicht „ab ab ab“.</p>','<p>A quantifier applies to the <b>one</b> thing right before it – a character, a class or a group. <code>ab+</code> means “a, then at least one b”, not “ab ab ab”.</p>'),
 rx:{p:'colou?r',f:'g',text:'color colour colouur colr\n2026 26 2 123456\nabab abbb',presets:[['colou?r','colou?r'],['colou*r','colou*r'],['colou+r','colou+r'],[R`\b\d{4}\b`,R`\b\d{4}\b`],[R`\b\d{2,3}\b`,R`\b\d{2,3}\b`],[R`\d{2,}`,R`\d{2,}`],['ab+','ab+'],['(ab)+','(ab)+']]},
 links:[MDN_RX('Quantifier')]}),

T({id:'greedy',cat:'quant',title:tx('Gierig oder genügsam','Greedy or lazy'),sub:'.+ vs .+?',keys:'greedy lazy reluctant non-greedy question mark html tags',
 desc:tx('<p>Quantoren sind <b>gierig</b>: Sie nehmen so viel wie möglich und geben nur zurück, wenn der Rest sonst nicht passt. Ein <code>?</code> dahinter macht sie <b>genügsam</b>. Noch besser ist oft eine negierte Klasse: Sie sagt genau, was nicht dazugehören darf.</p>','<p>Quantifiers are <b>greedy</b>: they take as much as possible and only give back if the rest wouldn’t fit otherwise. A <code>?</code> after them makes them <b>lazy</b>. Often even better is a negated class: it says exactly what must not be included.</p>'),
 rx:{p:'<.+>',f:'g',text:'<b>fett</b> und <i>kursiv</i>\n"eins" und "zwei"',presets:[['<.+>','<.+>'],['<.+?>','<.+?>'],['<[^>]+>','<[^>]+>'],['".*"','".*"'],['".*?"','".*?"'],['"[^"]*"','"[^"]*"']]},
 rule:tx('<code>[^&gt;]+</code> statt <code>.+?</code>, wo es geht: Es ist eindeutiger, schneller und kann nicht über die Grenze hinauslaufen.','<code>[^&gt;]+</code> instead of <code>.+?</code> where possible: it’s clearer, faster and can’t run past the boundary.'),
 links:[MDN_RX('Quantifier')]}),

T({id:'groupquant',cat:'quant',title:tx('Gruppen wiederholen','Repeating groups'),sub:tx('Und was dann in $1 steht','And what ends up in $1'),keys:'group quantifier repeat last iteration capture',
 desc:tx('<p>Mit Klammern wiederholst du mehr als ein Zeichen. Aber Achtung: Eine wiederholte Gruppe speichert nur ihren <b>letzten</b> Durchlauf.</p>','<p>With parentheses you repeat more than one character. But careful: a repeated group only stores its <b>last</b> iteration.</p>'),
 rx:{p:'(ha)+',f:'g',text:'hahaha ha hahahaha hah\n192.168.0.1 10.0.0.255',presets:[['ha+','ha+'],['(ha)+','(ha)+'],['(?:ha){2,3}','(?:ha){2,3}'],[R`(\d+\.){3}\d+`,R`(\d+\.){3}\d+`],[R`(\d+)\.(\d+)\.(\d+)\.(\d+)`,R`(\d+)\.(\d+)\.(\d+)\.(\d+)`]]},
 tip:tx(R`Bei <code>(\d+\.){3}\d+</code> steht in $1 nur „0.“ bzw. „0.“ – die letzte Wiederholung. Brauchst du alle Teile, schreib die Gruppen aus oder nimm <code>split()</code>.`,R`With <code>(\d+\.){3}\d+</code> $1 only holds the last repetition. If you need every part, write the groups out or use <code>split()</code>.`)}),

/* ---------- Gruppen ---------- */
T({id:'capture',cat:'groups',title:tx('Gruppen herausziehen','Capturing groups'),sub:'( … ) → $1',keys:'capture group extract parentheses $1 replace date',
 desc:tx('<p>Runde Klammern merken sich, was sie getroffen haben. Die Nummer zählt nach öffnenden Klammern von links. Beim Ersetzen holst du sie mit <code>$1</code>, <code>$2</code> … zurück – hier wird aus ISO-Datum ein deutsches.</p>','<p>Parentheses remember what they matched. The number counts opening parentheses from the left. When replacing you bring them back with <code>$1</code>, <code>$2</code> … – here an ISO date becomes a German one.</p>'),
 rx:{p:R`(\d{4})-(\d{2})-(\d{2})`,f:'g',text:tx('Termine: 2026-11-13, 2025-01-02 und 2024-12-24.','Dates: 2026-11-13, 2025-01-02 and 2024-12-24.'),repl:'$3.$2.$1',presets:[['ISO → DE',R`(\d{4})-(\d{2})-(\d{2})`,'g','$3.$2.$1'],[tx('nur Jahr','year only'),R`(\d{4})-\d{2}-\d{2}`,'g',tx('Jahr $1','year $1')],[tx('verschachtelt','nested'),R`((\d{4})-(\d{2}))-(\d{2})`,'g','[$1] $4']]},
 links:[MDN_RX('Capturing_group')]}),

T({id:'named',cat:'groups',title:tx('Benannte Gruppen','Named groups'),sub:'(?&lt;name&gt;…)',keys:'named group groups name $<name> readable',
 desc:tx('<p>Statt Nummern bekommen Gruppen Namen. Das liest sich besser und bricht nicht, wenn du später eine Klammer einfügst. Im Code: <code>match.groups.jahr</code>, beim Ersetzen <code>$&lt;jahr&gt;</code>.</p>','<p>Instead of numbers, groups get names. That reads better and doesn’t break when you add a parenthesis later. In code: <code>match.groups.year</code>, when replacing <code>$&lt;year&gt;</code>.</p>'),
 rx:{p:R`(?<jahr>\d{4})-(?<monat>\d{2})-(?<tag>\d{2})`,f:'g',text:tx('Release 2026-11-13, Hotfix 2026-11-20','Release 2026-11-13, hotfix 2026-11-20'),repl:'$<tag>.$<monat>.$<jahr>'},
 rule:tx('Ab zwei Gruppen lohnen sich Namen. <code>const {jahr, monat} = m.groups</code> liest sich wie Doku.','From two groups on, names pay off. <code>const {year, month} = m.groups</code> reads like documentation.'),
 links:[MDN_RX('Named_capturing_group')]}),

T({id:'noncapture',cat:'groups',title:tx('Gruppen ohne Speichern','Non-capturing groups'),sub:'(?:…)',keys:'non-capturing group ?: grouping only',
 desc:tx('<p>Oft brauchst du Klammern nur zum Bündeln – für <code>|</code> oder einen Quantor. <code>(?:…)</code> bündelt, ohne eine Nummer zu belegen. Die Nummern der anderen Gruppen bleiben dann stabil.</p>','<p>Often you only need parentheses to group – for <code>|</code> or a quantifier. <code>(?:…)</code> groups without taking a number. The numbers of the other groups then stay stable.</p>'),
 rx:{p:R`(?:Herr|Frau|Dr\.) (\w+)`,f:'g',text:tx('Herr Meier, Frau Schulz, Dr. Weber und Herrmann','Herr Meier, Frau Schulz, Dr. Weber and Herrmann'),repl:'[$1]',presets:[[tx('(?:…) – $1 ist der Name','(?:…) – $1 is the name'),R`(?:Herr|Frau|Dr\.) (\w+)`,'g','[$1]'],[tx('(…) – $1 ist die Anrede','(…) – $1 is the title'),R`(Herr|Frau|Dr\.) (\w+)`,'g','[$1]']]},
 links:[MDN_RX('Non-capturing_group')]}),

T({id:'backref',cat:'groups',title:tx('Rückverweise','Backreferences'),sub:R`\1 \k&lt;name&gt;`,keys:'backreference \\1 repeated word quotes same text',
 desc:tx(R`<p>Ein Rückverweis trifft <b>denselben Text</b>, den eine Gruppe vorher getroffen hat – nicht dasselbe Muster. So findest du doppelte Wörter oder passende Anführungszeichen.</p>`,R`<p>A backreference matches <b>the same text</b> a group matched before – not the same pattern. That’s how you find doubled words or matching quotes.</p>`),
 rx:{p:R`\b(\w+)\s+\1\b`,f:'gi',text:tx('Das ist ist ein Test test, der der Fehler findet. Die die ich meine.\n"eins" \'zwei\' "drei\' \'vier"','This is is a test Test that that finds errors. The the one.\n"one" \'two\' "three\' \'four"'),presets:[[tx('doppelte Wörter','doubled words'),R`\b(\w+)\s+\1\b`,'gi'],[tx('passende Quotes','matching quotes'),R`(["'])(.*?)\1`,'g'],[tx('benannt','named'),R`(?<q>["'])(?<inhalt>.*?)\k<q>`,'g'],[tx('Wiederholte Zeichen','repeated chars'),R`(\w)\1+`,'g']]},
 links:[MDN_RX('Backreference')]}),

T({id:'replace',cat:'groups',title:tx('Ersetzen mit Mustern','Replacing with patterns'),sub:'$1 $&amp; $&lt;name&gt;',keys:'replace replacement $& $1 swap rearrange',
 desc:tx('<p>Im Ersatztext gibt es eigene Platzhalter: <code>$1</code> für Gruppen, <code>$&amp;</code> für den ganzen Treffer, <code>$&lt;name&gt;</code> für benannte Gruppen und <code>$$</code> für ein echtes Dollarzeichen.</p>','<p>The replacement has its own placeholders: <code>$1</code> for groups, <code>$&amp;</code> for the whole match, <code>$&lt;name&gt;</code> for named groups and <code>$$</code> for a literal dollar sign.</p>'),
 rx:{p:'^(\\S+) (\\S+)$',f:'gm',text:'Erika Mustermann\nMax Muster\nAda Lovelace',repl:'$2, $1',presets:[[tx('Vor- und Nachname tauschen','swap first and last name'),R`^(\S+) (\S+)$`,'gm','$2, $1'],[tx('Treffer einrahmen','wrap match'),R`\b[A-Z]\w+`,'g','<$&>'],[tx('Preis in $','price in $'),R`\b(\w+)\b`,'g','$$$1']]},
 tip:tx('Ein einzelnes <code>$</code> vor etwas Unbekanntem bleibt stehen, <code>$$</code> wird zu „$“. Kommt der Ersatztext von Nutzern, nimm eine Funktion als zweites Argument – die wird nie interpretiert.','A single <code>$</code> before something unknown stays as is, <code>$$</code> becomes “$”. If the replacement comes from users, pass a function as the second argument – it is never interpreted.'),
 links:[mdn('Reference/Global_Objects/String/replace')]}),

/* ---------- Lookarounds ---------- */
T({id:'lookahead',cat:'look',title:'Lookahead',sub:'(?=…) (?!…)',keys:'lookahead positive negative assertion followed by',
 desc:tx('<p>Ein Lookahead prüft, was <b>danach</b> kommt, ohne es in den Treffer aufzunehmen. Negativ (<code>?!</code>) prüft, dass etwas <b>nicht</b> folgt.</p>','<p>A lookahead checks what comes <b>after</b> without adding it to the match. Negative (<code>?!</code>) checks that something does <b>not</b> follow.</p>'),
 rx:{p:R`\d+(?= EUR)`,f:'g',text:'100 EUR, 200 USD, 300 EUR, 4000 CHF',presets:[[tx('Zahl vor EUR','number before EUR'),R`\d+(?= EUR)`],[tx('naiv: nicht vor EUR','naive: not before EUR'),R`\d+(?! EUR)`],[tx('richtig: nicht vor EUR','correct: not before EUR'),R`\b\d+\b(?! EUR)`],[tx('zum Vergleich ohne Lookahead','for comparison without lookahead'),R`\d+ EUR`]]},
 tip:tx(R`<code>\d+(?! EUR)</code> findet in „100 EUR“ trotzdem „10“: Nach „10“ folgt „0“, nicht „ EUR“. Die Engine gibt so lange Ziffern ab, bis die Bedingung stimmt. Wortgrenzen auf beiden Seiten verhindern das.`,R`<code>\d+(?! EUR)</code> still finds “10” in “100 EUR”: after “10” comes “0”, not “ EUR”. The engine gives back digits until the condition holds. Word boundaries on both sides prevent that.`),
 links:[MDN_RX('Lookahead_assertion')]}),

T({id:'lookbehind',cat:'look',title:'Lookbehind',sub:'(?&lt;=…) (?&lt;!…)',keys:'lookbehind positive negative preceded by currency',
 desc:tx('<p>Das Gegenstück: prüft, was <b>davor</b> steht. In JavaScript darf der Lookbehind sogar beliebig lang sein – in vielen anderen Sprachen nicht.</p>','<p>The counterpart: checks what comes <b>before</b>. In JavaScript the lookbehind may even have any length – in many other languages it may not.</p>'),
 rx:{p:R`(?<=€)\d+(?:,\d+)?`,f:'g',text:'€20, $30, €45,50, 60€, €7',presets:[[tx('Betrag nach €','amount after €'),R`(?<=€)\d+(?:,\d+)?`],[tx('nicht nach €','not after €'),R`(?<![€\d,])\d+`],[tx('Betrag vor €','amount before €'),R`\d+(?=€)`]]},
 links:[MDN_RX('Lookbehind_assertion')]}),

T({id:'password',cat:'look',title:tx('Mehrere Bedingungen','Several conditions'),sub:tx('Passwortregeln mit Lookaheads','Password rules with lookaheads'),keys:'password rules lookahead multiple conditions validation',
 desc:tx('<p>Lookaheads am Anfang prüfen Bedingungen unabhängig voneinander, alle von derselben Stelle aus: mindestens eine Ziffer, ein Klein-, ein Großbuchstabe, mindestens 8 Zeichen.</p>','<p>Lookaheads at the start check conditions independently, all from the same position: at least one digit, one lowercase, one uppercase letter, at least 8 characters.</p>'),
 rx:{p:R`^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$`,f:'gm',text:'passwort\nPasswort1\nPASSWORT123\nKurz1A\nGanzLangesPasswortOhneZahl\nSicher2026!',presets:[[tx('alle Regeln','all rules'),R`^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$`,'gm'],[tx('nur Länge','length only'),'^.{8,}$','gm'],[tx('fehlt eine Ziffer?','missing a digit?'),R`^(?!.*\d).*$`,'gm']]},
 rule:tx('Für Nutzer besser: jede Regel einzeln prüfen und genau sagen, was fehlt. Und Länge schlägt Komplexität – NIST empfiehlt eher lange Passphrasen als Sonderzeichenpflicht.','Better for users: check each rule separately and say exactly what’s missing. And length beats complexity – NIST recommends long passphrases rather than mandatory special characters.')}),

T({id:'thousands',cat:'look',title:tx('Tausenderpunkte','Thousands separators'),sub:tx('Ein Klassiker mit Lookahead','A lookahead classic'),keys:'thousands separator number format lookahead position',
 desc:tx(R`<p>Gesucht ist keine Zeichenfolge, sondern eine <b>Stelle</b>: überall dort, wo danach eine durch drei teilbare Anzahl Ziffern bis zum Zahlende folgt. Der Treffer ist leer – ersetzt wird also nichts, sondern eingefügt.</p>`,R`<p>What we look for isn’t a string but a <b>position</b>: everywhere followed by a multiple of three digits up to the end of the number. The match is empty – so nothing is replaced, something is inserted.</p>`),
 rx:{p:R`\B(?=(\d{3})+(?!\d))`,f:'g',text:'1234567 und 1000 und 999 und 12345678,90',repl:'.'},
 tip:tx('Im echten Code: <code>new Intl.NumberFormat(\'de-DE\').format(1234567)</code> – kennt jedes Land, Dezimalstellen und Minuszeichen.','In real code: <code>new Intl.NumberFormat(\'de-DE\').format(1234567)</code> – knows every country, decimals and minus signs.')}),

/* ---------- Flags ---------- */
T({id:'flagsall',cat:'flags',title:tx('Alle Flags im Vergleich','All flags compared'),sub:'g i m s u y',keys:'flags global ignorecase multiline dotall unicode sticky',
 desc:tx('<p>Schalte die Flags oben einzeln an und aus. <code>g</code>: alle Treffer statt nur dem ersten. <code>i</code>: Groß/klein egal. <code>m</code>: <code>^</code>/<code>$</code> pro Zeile. <code>s</code>: Punkt trifft auch Zeilenumbrüche. <code>u</code>: echtes Unicode. <code>y</code>: nur genau an lastIndex.</p>','<p>Toggle the flags above one by one. <code>g</code>: all matches instead of only the first. <code>i</code>: ignore case. <code>m</code>: <code>^</code>/<code>$</code> per line. <code>s</code>: the dot also matches line breaks. <code>u</code>: real Unicode. <code>y</code>: only exactly at lastIndex.</p>'),
 rx:{p:'^apfel.*',f:'',text:'Apfel und Birne\napfelkuchen\nkein apfel hier',presets:[[tx('ohne Flags','no flags'),'^apfel.*',''],['g','^apfel.*','g'],['gi','^apfel.*','gi'],['gim','^apfel.*','gim'],[tx('gims – Punkt frisst alles','gims – dot eats everything'),'^apfel.*','gims']]},
 links:[MDN_RX('')]}),

{id:'lastindex',cat:'flags',title:tx('Die lastIndex-Falle','The lastIndex trap'),sub:tx('test() mit g liefert abwechselnd true und false','test() with g alternates true and false'),kind:'run',keys:'lastindex global test stateful bug validation g flag',
 desc:tx('<p>Eine Regex mit <code>g</code> (oder <code>y</code>) hat einen <b>Zustand</b>: <code>lastIndex</code>. Jeder Aufruf von <code>test()</code> oder <code>exec()</code> sucht ab dort weiter. Verwendest du dieselbe Regex für mehrere Strings, ist jeder zweite Test falsch.</p>','<p>A regex with <code>g</code> (or <code>y</code>) has <b>state</b>: <code>lastIndex</code>. Every call to <code>test()</code> or <code>exec()</code> continues from there. If you reuse the same regex for several strings, every second test is wrong.</p>'),
 vars:[
  [tx('mit g – kaputt','with g – broken'),R`const isNumber = /^\d+$/g;
for (const v of ['12', '34', '56', '78']) {
  console.log(v, isNumber.test(v), 'lastIndex jetzt', isNumber.lastIndex);
}`],
  [tx('ohne g – richtig','without g – correct'),R`const isNumber = /^\d+$/;
for (const v of ['12', '34', '56', '78']) {
  console.log(v, isNumber.test(v));
}`,tx('Für test() braucht man nie g.','test() never needs g.')],
  [tx('exec-Schleife mit g – gewollt','exec loop with g – intended'),R`const re = /\d+/g;
const text = 'a1 b22 c333';
let m;
while ((m = re.exec(text)) !== null) {
  console.log(m[0], 'bei', m.index, '→ lastIndex', re.lastIndex);
}`,tx('Hier ist der Zustand genau das, was man will. Heute ist matchAll() die bessere Wahl.','Here the state is exactly what you want. Today matchAll() is the better choice.')]
 ],
 rule:tx('Für Validierung (<code>test</code>) nie <code>g</code>. Angular: <code>Validators.pattern(/…/g)</code> zeigt genau diesen Fehler – jedes zweite Tippen gilt als ungültig.','Never use <code>g</code> for validation (<code>test</code>). Angular: <code>Validators.pattern(/…/g)</code> shows exactly this bug – every second keystroke counts as invalid.'),
 links:[mdn('Reference/Global_Objects/RegExp/lastIndex')]},

{id:'sticky',cat:'flags',title:tx('Sticky: Schritt für Schritt lesen','Sticky: reading step by step'),sub:tx('Das y-Flag für Tokenizer','The y flag for tokenizers'),kind:'run',keys:'sticky y flag tokenizer lexer lastindex',
 desc:tx('<p>Mit <code>y</code> sucht die Regex <b>nur</b> an <code>lastIndex</code>, nicht ab dort weiter. Perfekt für einen Tokenizer, der Stück für Stück liest und bei Unbekanntem sofort merkt, dass etwas nicht stimmt.</p>','<p>With <code>y</code> the regex matches <b>only</b> at <code>lastIndex</code>, not anywhere after it. Perfect for a tokenizer that reads piece by piece and notices immediately when something is unknown.</p>'),
 vars:[[tx('Tokenizer','Tokenizer'),R`const rules = [
  ['zahl', /\d+(?:\.\d+)?/y],
  ['op',   /[+\-*\/()]/y],
  ['leer', /\s+/y],
];
function tokenize(src) {
  const out = [];
  let pos = 0;
  outer: while (pos < src.length) {
    for (const [typ, re] of rules) {
      re.lastIndex = pos;
      const m = re.exec(src);
      if (m) { if (typ !== 'leer') out.push(typ + ':' + m[0]); pos = re.lastIndex; continue outer; }
    }
    throw new Error('Unbekanntes Zeichen an Position ' + pos + ': ' + src[pos]);
  }
  return out;
}
console.log(tokenize('3 + 4.5 * (2 - 1)'));
console.log(tokenize('3 + x'));`],
  [tx('g zum Vergleich','g for comparison'),R`const g = /\d+/g, y = /\d+/y;
g.lastIndex = 0; y.lastIndex = 0;
console.log('g:', g.exec('ab12'));   // sucht weiter und findet 12
console.log('y:', y.exec('ab12'));   // an Position 0 steht "a" → null`]],
 links:[mdn('Reference/Global_Objects/RegExp/sticky')]},

{id:'dflag',cat:'flags',title:tx('Positionen der Gruppen','Group positions'),sub:tx('Das d-Flag','The d flag'),kind:'run',keys:'d flag hasindices indices positions highlight',
 desc:tx('<p>Mit <code>d</code> liefert jeder Treffer zusätzlich <code>indices</code>: Start und Ende jeder Gruppe. Genau damit unterstreicht der Tester dieser Seite die Gruppen farbig.</p>','<p>With <code>d</code> every match also returns <code>indices</code>: start and end of each group. That’s exactly how this page’s tester underlines groups in colour.</p>'),
 vars:[[tx('indices','indices'),R`const m = /(?<user>\w+)@(?<host>[\w.]+)/d.exec('Mail an ada@example.org bitte');
console.log('Treffer', m.indices[0]);
console.log('user', m.indices.groups.user, 'host', m.indices.groups.host);`]],
 links:[mdn('Reference/Global_Objects/RegExp/hasIndices')]},

/* ---------- JavaScript-API ---------- */
{id:'methods',cat:'api',title:tx('Die Methoden','The methods'),sub:'test, exec, match, matchAll, search',kind:'run',keys:'test exec match matchall search api methods',
 desc:tx('<p>Welche Methode liefert was? Die Unterschiede sind klein, aber wichtig – besonders, ob das <code>g</code>-Flag gesetzt ist.</p>','<p>Which method returns what? The differences are small but important – especially whether the <code>g</code> flag is set.</p>'),
 vars:[
  ['test',R`const re = /\d+/;
console.log(re.test('Raum 12'), re.test('kein Raum'));`,tx('Nur ja oder nein. Ideal für Validierung.','Just yes or no. Ideal for validation.')],
  [tx('match ohne g','match without g'),R`const m = 'Raum 12, Etage 3'.match(/(\d+)/);
console.log(m[0], m[1], 'index', m.index);`,tx('Erster Treffer mit Gruppen und Position.','First match with groups and position.')],
  [tx('match mit g','match with g'),R`console.log('Raum 12, Etage 3, Platz 45'.match(/(\d+)/g));`,tx('Alle Treffer – aber ohne Gruppen und Positionen!','All matches – but without groups and positions!')],
  ['matchAll',R`for (const m of 'Raum 12, Etage 3'.matchAll(/(?<wort>\w+) (?<zahl>\d+)/g)) {
  console.log(m.groups.wort, m.groups.zahl, 'bei', m.index);
}`,tx('Alle Treffer mit allem. Verlangt das g-Flag.','All matches with everything. Requires the g flag.')],
  ['search',R`console.log('Hallo Welt'.search(/w/i), 'Hallo'.search(/x/));`,tx('Nur die Position, -1 wenn nichts.','Just the position, -1 if nothing.')]
 ],
 links:[mdn('Guide/Regular_expressions')]},

{id:'replacefn',cat:'api',title:tx('replace mit Funktion','replace with a function'),sub:tx('und replaceAll','and replaceAll'),kind:'run',keys:'replace function callback replaceall dynamic replacement',
 desc:tx('<p>Statt eines Ersatztexts kannst du eine Funktion übergeben. Sie bekommt den Treffer und alle Gruppen und gibt zurück, was hin soll – für alles, was sich mit <code>$1</code> nicht ausdrücken lässt.</p>','<p>Instead of a replacement string you can pass a function. It receives the match and all groups and returns what should go there – for anything you can’t express with <code>$1</code>.</p>'),
 vars:[
  [tx('Großschreiben','Capitalise'),R`const titel = 'der herr der ringe'.replace(/\b\p{L}/gu, c => c.toUpperCase());
console.log(titel);`],
  [tx('Preise umrechnen','Convert prices'),R`const preise = 'Kaffee 3,50 €, Kuchen 4,20 €';
const usd = preise.replace(/(\d+),(\d+) €/g, (_, eur, cent) => '$' + (Number(eur + '.' + cent) * 1.08).toFixed(2));
console.log(usd);`],
  [tx('Vorlage füllen','Fill a template'),R`const daten = { name: 'Ada', ort: 'London' };
console.log('Hallo {name} aus {ort}, {fehlt}!'.replace(/\{(\w+)\}/g, (m, k) => k in daten ? daten[k] : m));`],
  [tx('replaceAll-Falle','replaceAll trap'),R`console.log('a-b-c'.replaceAll('-', '+'));
try {
  'a-b-c'.replaceAll(/-/, '+');
} catch (e) {
  console.error(e.constructor.name + ': ' + e.message);
}`,tx('replaceAll mit Regex verlangt das g-Flag – sonst TypeError.','replaceAll with a regex requires the g flag – otherwise TypeError.')]
 ],
 links:[mdn('Reference/Global_Objects/String/replace')]},

{id:'split',cat:'api',title:'split',sub:tx('Trennen mit Muster','Splitting with a pattern'),kind:'run',keys:'split separator capture group limit',
 desc:tx('<p><code>split()</code> nimmt auch eine Regex. Überraschung: Gruppen im Trennmuster landen <b>mit im Ergebnis</b>.</p>','<p><code>split()</code> also takes a regex. Surprise: groups in the separator end up <b>in the result</b>.</p>'),
 vars:[
  [tx('mehrere Trenner','several separators'),R`console.log('a, b;c  d|e'.split(/[,;|\s]+/));`],
  [tx('mit Gruppe','with group'),R`console.log('1+2-3'.split(/([+-])/));`,tx('Die Operatoren bleiben erhalten – praktisch oder ein Bug, je nachdem.','The operators are kept – handy or a bug, depending.')],
  [tx('Zeilen','lines'),R`const text = 'Windows\r\nUnix\nAltes Mac\rEnde';
console.log(text.split(/\r\n|\r|\n/));`,tx('Alle drei Zeilenende-Varianten auf einmal.','All three line ending styles at once.')]
 ],
