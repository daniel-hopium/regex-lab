{id:'dynamic',cat:'api',title:tx('Regex aus Nutzereingaben','Regex from user input'),sub:tx('Escapen nicht vergessen','Don’t forget to escape'),kind:'run',keys:'new regexp constructor escape user input injection regexp.escape',
 desc:tx('<p>Baust du eine Regex aus einem String, werden Sonderzeichen darin aktiv. Eine Suche nach „1+1“ oder „(“ geht dann schief – oder wirft einen Fehler. Und im String-Literal musst du Backslashes doppelt schreiben.</p>','<p>If you build a regex from a string, special characters in it become active. A search for “1+1” or “(” goes wrong – or throws. And inside a string literal you have to double the backslashes.</p>'),
 vars:[
  [tx('ohne Escape','without escape'),R`const suche = '1+1';
console.log(new RegExp(suche).test('1+1=2'));   // + heißt "mindestens einmal"
console.log(new RegExp(suche).test('11=2'));
try { new RegExp('('); } catch (e) { console.error(e.message); }`],
  [tx('mit Escape','with escape'),R`const escape = s => s.replace(/[.*+?^{}$()|[\]\\\/-]/g, '\\$&');
const suche = '1+1';
console.log(escape(suche));
console.log(new RegExp(escape(suche)).test('1+1=2'), new RegExp(escape(suche)).test('11=2'));
console.log(typeof RegExp.escape === 'function' ? 'RegExp.escape: ' + RegExp.escape(suche) : 'RegExp.escape gibt es in diesem Browser noch nicht');`,tx('RegExp.escape() ist neu (ES2025) – bis es überall da ist, die eigene Funktion.','RegExp.escape() is new (ES2025) – until it’s everywhere, use your own function.')],
  [tx('doppelte Backslashes','double backslashes'),R`console.log(new RegExp('\d+').source);    // aus '\d' wird 'd'
console.log(new RegExp('\\d+').source);   // so ist es richtig
console.log(new RegExp(String.raw` + '`' + R`\d+` + '`' + R`).source);`,tx('Im String-Literal ist \\d nur ein d. String.raw lässt Backslashes in Ruhe.','In a string literal \\d is just a d. String.raw leaves backslashes alone.')]
 ],
 rule:tx('Nutzereingaben nie ungeprüft in <code>new RegExp()</code>. Escapen – oder gleich <code>includes()</code>, wenn es nur um Text geht.','Never put user input into <code>new RegExp()</code> unchecked. Escape it – or just use <code>includes()</code> if it’s only about text.'),
 links:[mdn('Reference/Global_Objects/RegExp/escape')]},

/* ---------- Unicode ---------- */
T({id:'umlauts',cat:'unicode',title:tx('Umlaute und andere Schriften','Accents and other scripts'),sub:R`\w gegen \p{L}`,keys:'umlaut unicode property \\p{L} letter german accents i18n',
 desc:tx(R`<p><code>\w</code> und <code>[a-z]</code> stammen aus der ASCII-Zeit. Für echte Sprache nimmst du Unicode-Eigenschaften: <code>\p{L}</code> ist jeder Buchstabe jeder Schrift, <code>\p{Lu}</code> jeder Großbuchstabe. Das funktioniert nur mit Flag <code>u</code>.</p>`,R`<p><code>\w</code> and <code>[a-z]</code> come from the ASCII era. For real language use Unicode properties: <code>\p{L}</code> is any letter of any script, <code>\p{Lu}</code> any uppercase letter. This only works with flag <code>u</code>.</p>`),
 rx:{p:R`\w+`,f:'g',text:'Größe Übermaß café naïve Ελλάδα Москва 東京 Søren',presets:[[R`\w+`,R`\w+`,'g'],['[a-zA-Z]+','[a-zA-Z]+','g'],[R`\p{L}+`,R`\p{L}+`,'gu'],[R`\p{Lu}\p{Ll}+`,R`\p{Lu}\p{Ll}+`,'gu'],[R`\p{Script=Greek}+`,R`\p{Script=Greek}+`,'gu']]},
 rule:tx(R`Sobald Namen oder Freitext im Spiel sind: <code>\p{L}</code> mit Flag <code>u</code>. Und Wortgrenzen <code>\b</code> sind ebenfalls ASCII – „Größe“ hat für <code>\b</code> mittendrin Grenzen.`,R`As soon as names or free text are involved: <code>\p{L}</code> with flag <code>u</code>. And word boundaries <code>\b</code> are ASCII too – “Größe” has boundaries in the middle for <code>\b</code>.`),
 links:[MDN_RX('Unicode_character_class_escape')]}),

{id:'emoji',cat:'unicode',title:tx('Emojis und das u-Flag','Emojis and the u flag'),sub:tx('Warum ein Emoji zwei Zeichen lang ist','Why an emoji is two characters long'),kind:'run',keys:'emoji surrogate pair utf-16 u flag length code point grapheme',
 desc:tx('<p>JavaScript-Strings bestehen aus UTF-16-Einheiten. Emojis brauchen zwei davon (ein Surrogatpaar). Ohne <code>u</code> sieht die Regex zwei halbe Zeichen; Familien-Emojis bestehen sogar aus mehreren Emojis mit Verbindern.</p>','<p>JavaScript strings consist of UTF-16 units. Emojis need two of them (a surrogate pair). Without <code>u</code> the regex sees two half characters; family emojis even consist of several emojis with joiners.</p>'),
 vars:[
  [tx('Länge','length'),R`const s = '😀';
console.log(s.length, [...s].length);
console.log(/^.$/.test(s), /^.$/u.test(s));`],
  [tx('Emojis finden','finding emojis'),R`const text = 'Gut gemacht 👍 danke ❤️ 👨‍👩‍👧';
console.log(text.match(/\p{Extended_Pictographic}/gu));
console.log(text.match(/\p{RGI_Emoji}/gv) ?? 'v-Flag nicht unterstützt');`,tx('Mit v und \\p{RGI_Emoji} bleibt die Familie ein Ganzes.','With v and \\p{RGI_Emoji} the family stays one piece.')],
  [tx('Zeichen zählen','counting characters'),R`const s = 'Familie: 👨‍👩‍👧';
console.log('length', s.length);
console.log('Codepoints', [...s].length);
const seg = new Intl.Segmenter('de', { granularity: 'grapheme' });
console.log('sichtbar', [...seg.segment(s)].length);`,tx('Was ein Mensch als ein Zeichen sieht, zählt Intl.Segmenter.','What a human sees as one character is counted by Intl.Segmenter.')]
 ],
 links:[mdn('Reference/Global_Objects/RegExp/unicode')]},

{id:'casefold',cat:'unicode',title:tx('Groß, klein und ß','Upper, lower and ß'),sub:tx('Wo das i-Flag aufhört','Where the i flag stops'),kind:'run',keys:'case insensitive i flag ß sharp s turkish i normalize nfc diacritics',
 desc:tx('<p>Das <code>i</code>-Flag vergleicht Zeichen für Zeichen. „ß“ und „SS“ sind aber unterschiedlich lang, und „é“ kann als ein Zeichen oder als „e“ plus Akzent gespeichert sein.</p>','<p>The <code>i</code> flag compares character by character. But “ß” and “SS” have different lengths, and “é” can be stored as one character or as “e” plus an accent.</p>'),
 vars:[
  ['ß',R`console.log(/straße/i.test('STRASSE'), 'ß'.toUpperCase());
console.log('straße'.localeCompare('STRASSE', 'de', { sensitivity: 'base' }) === 0);`,tx('Für Vergleiche ohne Groß/klein: localeCompare oder Intl.Collator.','For case-insensitive comparisons: localeCompare or Intl.Collator.')],
  [tx('Akzente','accents'),R`const a = 'café', b = 'cafe\u0301';
console.log(a === b, a.length, b.length);
console.log(a.normalize('NFC') === b.normalize('NFC'));
console.log('Crème brûlée'.normalize('NFD').replace(/\p{M}/gu, ''));`,tx('normalize("NFD") trennt Akzente ab, \\p{M} entfernt sie – praktisch für Suchfelder.','normalize("NFD") separates accents, \\p{M} removes them – handy for search fields.')]
 ],
 links:[mdn('Reference/Global_Objects/String/normalize')]},

/* ---------- Rezepte ---------- */
T({id:'email',cat:'recipes',title:tx('E-Mail-Adresse','Email address'),sub:tx('Pragmatisch statt perfekt','Pragmatic instead of perfect'),keys:'email validation address pragmatic rfc 5322',
 desc:tx('<p>Die „perfekte“ E-Mail-Regex nach RFC 5322 ist hunderte Zeichen lang und trotzdem nutzlos: Ob es die Adresse gibt, weiß man erst nach dem Senden. Pragmatisch reicht: etwas, ein @, etwas, ein Punkt, etwas – ohne Leerzeichen.</p>','<p>The “perfect” email regex per RFC 5322 is hundreds of characters long and still useless: whether the address exists you only know after sending. Pragmatically this suffices: something, an @, something, a dot, something – without spaces.</p>'),
 rx:{p:R`^[^\s@]+@[^\s@]+\.[^\s@]+$`,f:'gm',text:'ada@example.org\nmax.muster+news@mail.co.uk\nkein-at.example.org\nzwei@@example.org\nleer zeichen@example.org\nüber@müller.de\nende@punkt.',presets:[[tx('pragmatisch','pragmatic'),R`^[^\s@]+@[^\s@]+\.[^\s@]+$`,'gm'],[tx('zu streng','too strict'),R`^[a-z0-9.]+@[a-z]+\.[a-z]{2,3}$`,'gm'],[tx('wie type="email"','like type="email"'),R`^[a-zA-Z0-9.!#$%&'*+\/=?^_\x60{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$`,'gm']]},
 rule:tx('Validieren ist Nutzerhilfe gegen Tippfehler, keine Garantie. Die zu strenge Variante sperrt echte Kunden aus (Plus-Adressen, .museum, Umlaut-Domains).','Validation helps users catch typos, it’s no guarantee. The too-strict variant locks out real customers (plus addresses, .museum, IDN domains).'),
 links:[['https://html.spec.whatwg.org/multipage/input.html#valid-e-mail-address','HTML: valid e-mail address']]}),

T({id:'dates',cat:'recipes',title:tx('Datum','Date'),sub:'TT.MM.JJJJ',keys:'date format validation day month year german',
 desc:tx('<p>Eine Regex kann die <b>Form</b> prüfen: 01–31, 01–12, vier Ziffern. Ob es den 31.02. gibt, weiß sie nicht – dafür braucht es ein echtes Datum.</p>','<p>A regex can check the <b>form</b>: 01–31, 01–12, four digits. Whether 31.02. exists it doesn’t know – that needs a real date.</p>'),
 rx:{p:R`^(0[1-9]|[12]\d|3[01])\.(0[1-9]|1[0-2])\.(\d{4})$`,f:'gm',text:'13.11.2026\n1.1.2026\n31.02.2026\n32.01.2026\n00.10.2026\n29.02.2028\n15.13.2026',presets:[[tx('streng mit Nullen','strict with zeros'),R`^(0[1-9]|[12]\d|3[01])\.(0[1-9]|1[0-2])\.(\d{4})$`,'gm'],[tx('Nullen optional','zeros optional'),R`^(0?[1-9]|[12]\d|3[01])\.(0?[1-9]|1[0-2])\.(\d{4})$`,'gm'],[tx('naiv','naive'),R`^\d{2}\.\d{2}\.\d{4}$`,'gm']]},
 tip:tx('„31.02.2026“ besteht die Regex. Danach: <code>const d = new Date(j, m - 1, t); d.getDate() === t</code> – der Date-Konstruktor rollt den 31.02. in den März, und schon fällt es auf.','“31.02.2026” passes the regex. Afterwards: <code>const d = new Date(y, m - 1, d); d.getDate() === d</code> – the Date constructor rolls 31.02. into March, and it shows.')}),

T({id:'numbers',cat:'recipes',title:tx('Zahlen im deutschen Format','Numbers in German format'),sub:'1.234,56',keys:'number decimal comma thousands german format extract parse',
 desc:tx('<p>Im Deutschen ist das Komma das Dezimalzeichen und der Punkt der Tausendertrenner. Das Muster erlaubt optionale Tausenderpunkte – aber nur in Dreiergruppen.</p>','<p>In German the comma is the decimal separator and the dot the thousands separator. The pattern allows optional thousands dots – but only in groups of three.</p>'),
 rx:{p:R`-?\b\d{1,3}(?:\.\d{3})*(?:,\d+)?\b|-?\b\d+(?:,\d+)?\b`,f:'g',text:'Summe 1.234,56 €, Rabatt -7,5 %, Menge 1000 Stück, falsch 12.34,5 und 3,14159',presets:[[tx('mit Tausenderpunkten','with thousands dots'),R`-?\b\d{1,3}(?:\.\d{3})*(?:,\d+)?\b|-?\b\d+(?:,\d+)?\b`],[tx('einfach','simple'),R`-?\d+(?:,\d+)?`]]},
 tip:tx('Zum Rechnen: Punkte entfernen, Komma zu Punkt, dann <code>Number()</code>. Oder gleich die Eingabe mit <code>Intl.NumberFormat</code> formatieren und den Wert getrennt speichern.','For calculations: remove dots, comma to dot, then <code>Number()</code>. Or format the input with <code>Intl.NumberFormat</code> and store the value separately.')}),

T({id:'iban',cat:'recipes',title:tx('IBAN, PLZ, Telefon','IBAN, postcode, phone'),sub:tx('Formate prüfen','Checking formats'),keys:'iban postcode plz phone telephone validation format',
 desc:tx('<p>Formate mit fester Struktur sind die Paradedisziplin für Regex. Wichtig: Leerzeichen erlauben, weil Menschen sie tippen – und vor dem Speichern entfernen.</p>','<p>Formats with fixed structure are the showcase discipline for regex. Important: allow spaces, because people type them – and strip them before storing.</p>'),
 rx:{p:R`^DE\d{2}(?: ?\d{4}){4} ?\d{2}$`,f:'gm',text:'DE89 3704 0044 0532 0130 00\nDE89370400440532013000\nDE89 3704 0044 0532 0130\nAT61 1904 3002 3457 3201\n80331\n8033\n+49 89 1234567\n089/1234567\n(089) 123 45 67',presets:[['IBAN DE',R`^DE\d{2}(?: ?\d{4}){4} ?\d{2}$`,'gm'],[tx('PLZ (DE)','postcode (DE)'),R`^\d{5}$`,'gm'],[tx('Telefon grob','phone rough'),R`^\+?[\d\s/()-]{6,}$`,'gm']]},
 tip:tx('Die IBAN-Regex prüft nur die Form. Die Prüfziffer (Modulo 97) rechnet erst Code – ein Zahlendreher fällt der Regex nicht auf.','The IBAN regex only checks the form. The check digit (modulo 97) needs code – a transposed digit passes the regex.')}),

T({id:'urls',cat:'recipes',title:tx('Links aus Text ziehen','Extracting links from text'),sub:'https?://…',keys:'url link extract http https autolink',
 desc:tx('<p>Zum Herausziehen von Links aus Fließtext: Protokoll, dann alles bis zum nächsten Leerzeichen. Schwierig sind Satzzeichen am Ende – gehört der Punkt nach dem Link dazu?</p>','<p>For extracting links from prose: protocol, then everything up to the next space. The tricky part is punctuation at the end – does the dot after the link belong to it?</p>'),
 rx:{p:R`https?:\/\/[^\s<>"]+[^\s<>".,;:!?)]`,f:'g',text:tx('Doku unter https://developer.mozilla.org/de/docs/Web. Oder (https://example.org/a?b=1) – und http://localhost:4200!','Docs at https://developer.mozilla.org/en-US/docs/Web. Or (https://example.org/a?b=1) – and http://localhost:4200!'),presets:[[tx('naiv','naive'),R`https?:\/\/\S+`],[tx('ohne Satzzeichen am Ende','without trailing punctuation'),R`https?:\/\/[^\s<>"]+[^\s<>".,;:!?)]`]]},
 rule:tx('Zum Prüfen einer einzelnen URL: <code>URL.canParse(s)</code> oder <code>new URL(s)</code> im try – der Browser kennt die Regeln besser als jede Regex.','To check a single URL: <code>URL.canParse(s)</code> or <code>new URL(s)</code> in a try – the browser knows the rules better than any regex.')}),

T({id:'logs',cat:'recipes',title:tx('Logzeilen zerlegen','Parsing log lines'),sub:tx('Benannte Gruppen im Einsatz','Named groups in action'),keys:'log parsing named groups multiline level timestamp',
 desc:tx('<p>Logs haben feste Spalten – ideal für benannte Gruppen. Mit <code>m</code> gelten <code>^</code> und <code>$</code> pro Zeile.</p>','<p>Logs have fixed columns – ideal for named groups. With <code>m</code>, <code>^</code> and <code>$</code> apply per line.</p>'),
 rx:{p:R`^(?<zeit>\S+) (?<level>INFO|WARN|ERROR) \[(?<modul>[^\]]+)\] (?<text>.*)$`,f:'gm',text:'2026-11-13T09:12:01Z INFO [auth] Login ok für ada\n2026-11-13T09:12:07Z WARN [api] Langsame Antwort 2300 ms\n2026-11-13T09:13:44Z ERROR [db] Verbindung verloren\nkaputte Zeile ohne Format\n2026-11-13T09:14:00Z DEBUG [ui] wird nicht erfasst',presets:[[tx('alle Level','all levels'),R`^(?<zeit>\S+) (?<level>INFO|WARN|ERROR) \[(?<modul>[^\]]+)\] (?<text>.*)$`,'gm'],[tx('nur Fehler','errors only'),R`^\S+ ERROR \[(?<modul>[^\]]+)\] (?<text>.*)$`,'gm']]}}),

T({id:'cleanup',cat:'recipes',title:tx('Text aufräumen','Cleaning up text'),sub:tx('Leerraum, Trim, Slugs','Whitespace, trim, slugs'),keys:'whitespace trim collapse spaces slug cleanup normalize',
 desc:tx('<p>Doppelte Leerzeichen, Tabs, Leerzeilen: Mit Ersetzen ist das eine Zeile. Wähl ein Rezept – das Ergebnis steht unten.</p>','<p>Double spaces, tabs, blank lines: with replace it’s one line. Pick a recipe – the result is below.</p>'),
 rx:{p:R`[ \t]{2,}`,f:'g',text:'  Zu   viele    Leerzeichen\t\tund Tabs.  \n\n\n\nLeerzeilen auch.  ',repl:' ',presets:[[tx('Leerzeichen zusammenfassen','collapse spaces'),R`[ \t]{2,}`,'g',' '],['Trim',R`^\s+|\s+$`,'g',''],[tx('Trim pro Zeile','trim per line'),R`^[ \t]+|[ \t]+$`,'gm',''],[tx('Leerzeilen reduzieren','reduce blank lines'),R`\n{3,}`,'g','\n\n'],[tx('Slug','slug'),R`[^a-z0-9]+`,'gi','-']]}}),

{id:'angular',cat:'recipes',title:tx('Regex in Angular-Formularen','Regex in Angular forms'),sub:'Validators.pattern',kind:'run',keys:'angular validators pattern form validation anchors string regexp',
 desc:tx('<p><code>Validators.pattern</code> nimmt einen String oder eine Regex – und behandelt beide unterschiedlich. Ein String bekommt automatisch <code>^…$</code>, eine Regex nicht. So sieht das intern aus:</p>','<p><code>Validators.pattern</code> takes a string or a regex – and treats them differently. A string automatically gets <code>^…$</code>, a regex doesn’t. That’s what it does internally:</p>'),
 vars:[
  [tx('String: Anker automatisch','string: anchors automatic'),R`// So baut Angular aus einem String die Regex:
function pattern(p) {
  const re = typeof p === 'string' ? new RegExp('^' + p + '$') : p;
  return v => re.test(v) ? null : { pattern: true };
}
const plz = pattern('\\d{5}');
console.log(plz('80331'), plz('80331x'), plz('x80331'));`],
  [tx('Regex: keine Anker','regex: no anchors'),R`function pattern(p) {
  const re = typeof p === 'string' ? new RegExp('^' + p + '$') : p;
  return v => re.test(v) ? null : { pattern: true };
}
const plz = pattern(/\d{5}/);
console.log(plz('80331'), plz('Hausnr 80331x'));`,tx('Ohne ^…$ ist „Hausnr 80331x“ gültig.','Without ^…$ “Hausnr 80331x” is valid.')],
  [tx('Regex mit g','regex with g'),R`function pattern(p) {
  const re = typeof p === 'string' ? new RegExp('^' + p + '$') : p;
  return v => re.test(v) ? null : { pattern: true };
}
const plz = pattern(/^\d{5}$/g);
for (const v of ['80331', '80331', '80331']) console.log(v, plz(v));`,tx('Die lastIndex-Falle: dieselbe Eingabe ist abwechselnd gültig und ungültig.','The lastIndex trap: the same input is alternately valid and invalid.')]
 ],
 rule:tx(R`In Angular als Regex-Literal mit Ankern und ohne g: <code>Validators.pattern(/^\d{5}$/)</code>. Das ist eindeutig und braucht keine doppelten Backslashes.`,R`In Angular use a regex literal with anchors and without g: <code>Validators.pattern(/^\d{5}$/)</code>. It’s unambiguous and needs no double backslashes.`),
 links:[['https://angular.dev/api/forms/Validators#pattern','Angular: Validators.pattern']]},

T({id:'csv',cat:'recipes',title:tx('CSV mit Anführungszeichen','CSV with quotes'),sub:tx('Wo Regex an Grenzen stößt','Where regex hits its limits'),keys:'csv quotes split comma parser lookahead',
 desc:tx('<p>Kommas trennen Felder – außer in Anführungszeichen. Eine Regex kann das mit einem Lookahead lösen, der zählt, ob danach eine gerade Anzahl Anführungszeichen folgt. Das funktioniert, ist aber schwer zu lesen und langsam bei langen Zeilen.</p>','<p>Commas separate fields – except inside quotes. A regex can solve that with a lookahead that counts whether an even number of quotes follows. It works but is hard to read and slow on long lines.</p>'),
 rx:{p:R`"(?:[^"]|"")*"|[^,\n]+`,f:'g',text:'Name,Ort,Notiz\nAda,"London, UK","sagt ""Hallo"""\nMax,München,',presets:[[tx('Felder finden','find fields'),R`"(?:[^"]|"")*"|[^,\n]+`],[tx('Kommas außerhalb von Quotes','commas outside quotes'),R`,(?=(?:[^"]*"[^"]*")*[^"]*$)`,'gm'],[tx('naiv: jedes Komma','naive: every comma'),',']]},
 rule:tx('Für echtes CSV einen Parser nehmen (Papa Parse, csv-parse). Leere Felder, Zeilenumbrüche in Quotes und verschiedene Trennzeichen machen jede Regex unlesbar.','Use a parser for real CSV (Papa Parse, csv-parse). Empty fields, line breaks inside quotes and different separators make any regex unreadable.')}),

/* ---------- Fallen ---------- */
{id:'redos',cat:'pitfalls',title:tx('Katastrophales Backtracking','Catastrophic backtracking'),sub:tx('Echt gemessen – im Worker, damit die Seite nicht einfriert','Measured for real – in a worker so the page doesn’t freeze'),kind:'custom',keys:'catastrophic backtracking redos exponential nested quantifiers performance',
 desc:tx('<p>Verschachtelte Quantoren wie <code>(a+)+</code> lassen der Engine unzählige Wege, denselben Text aufzuteilen. Passt das Ende nicht, probiert sie <b>alle</b>. Jedes zusätzliche Zeichen verdoppelt die Zeit. Gemessen wird wirklich, an Text der Form „aaaa…a!“.</p>','<p>Nested quantifiers like <code>(a+)+</code> give the engine countless ways to split the same text. If the end doesn’t fit, it tries <b>all</b> of them. Every extra character doubles the time. This really measures, on text of the form “aaaa…a!”.</p>'),
 html:()=>`<div class="rx"><fieldset class="ca-vals"><legend class="sim-lbl">${tx('Muster','Pattern')}</legend>${[['(a+)+$',tx('verschachtelt','nested')],['(a|aa)+$',tx('überlappende Alternativen','overlapping alternatives')],[R`^(\w+\s?)+$`,tx('Wörter mit optionalem Leerzeichen','words with optional space')],['a+$',tx('harmlos','harmless')]].map(([p,l],i)=>`<label><input type="radio" name="rd-p" value="${esc(p)}"${i===0?' checked':''}><code>${esc(p)}</code>&nbsp;${l}</label>`).join('')}</fieldset>
  <div class="stage-row"><button type="button" class="btn btn-primary btn-sm rd-go">${ic('play2')}${tx('Messen','Measure')}</button><span class="rd-st" aria-live="polite"></span></div>
  <div class="rd-bars"></div></div>`,
 init(wg){
  let alive=true,busy=false;
  $('.rd-go',wg).addEventListener('click',async()=>{
   if(busy)return;busy=true;const p=$('input[name="rd-p"]:checked',wg).value,box=$('.rd-bars',wg);box.innerHTML='';const rows=[];
   for(let n=14;n<=34;n+=2){
    if(!alive)return;$('.rd-st',wg).textContent=tx(`n = ${n} …`,`n = ${n} …`);
    const r=await RX({op:'time',src:p,flags:'',text:'a'.repeat(n)+'!'},2000);
    rows.push([n,r.timeout?2000:r.ms,!!r.timeout]);
    const max=Math.max(...rows.map(x=>x[1]),1);
    box.innerHTML=rows.map(([n,t,d])=>`<div class="rd-bar${d?' dead':t>200?' slow':''}"><span>n = ${n}</span><span class="rd-track"><span class="rd-fill" style="width:${Math.max(t/max*100,.8)}%"></span></span><span>${d?tx('> 2 s – abgebrochen','> 2 s – stopped'):t<1?'< 1 ms':Math.round(t).toLocaleString(LOCALE)+' ms'}</span></div>`).join('');
    if(r.timeout)break;
   }
   $('.rd-st',wg).textContent=rows.some(r=>r[2])?tx('Der Worker wurde abgebrochen. Im Main Thread hinge jetzt die ganze Seite.','The worker was terminated. On the main thread the whole page would hang now.'):tx('Fertig.','Done.');busy=false;
  });
  return ()=>{alive=false};
 },
 rule:tx(R`Keine Quantoren in Quantoren, deren Teile dasselbe treffen können. <code>(a+)+</code> → <code>a+</code>, <code>(\w+\s?)+</code> → <code>\w+(?:\s\w+)*</code>. Und Eingaben vor der Regex auf eine Maximallänge begrenzen.`,R`No quantifiers inside quantifiers whose parts can match the same thing. <code>(a+)+</code> → <code>a+</code>, <code>(\w+\s?)+</code> → <code>\w+(?:\s\w+)*</code>. And cap input length before the regex.`),
 tip:tx('Das ist eine echte Angriffsform (ReDoS): Ein präparierter String in einem Formular legt einen Node-Server lahm, weil der Event Loop blockiert.','This is a real attack (ReDoS): a crafted string in a form takes down a Node server because the event loop is blocked.'),
 links:[['https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS','OWASP: ReDoS'],['https://daniel-hopium.github.io/security-lab/#jsfallen/redos',tx('Sicherheits-Labor: ReDoS','Security Lab: ReDoS')]]},

T({id:'html',cat:'pitfalls',title:tx('HTML mit Regex parsen','Parsing HTML with regex'),sub:tx('Warum es schiefgeht','Why it goes wrong'),keys:'html parse regex nested tags domparser',
 desc:tx('<p>HTML ist verschachtelt, und Regex kann nicht zählen, wie tief man gerade steckt. Das genügsame <code>&lt;div&gt;.*?&lt;/div&gt;</code> endet beim ersten schließenden Tag – mitten im inneren Element. Dazu kommen Attribute mit „&gt;“, Kommentare und Groß/klein.</p>','<p>HTML is nested, and a regex can’t count how deep it is. The lazy <code>&lt;div&gt;.*?&lt;/div&gt;</code> ends at the first closing tag – in the middle of the inner element. Add attributes containing “&gt;”, comments and case differences.</p>'),
 rx:{p:'<div>.*?</div>',f:'gs',text:'<div>außen <div>innen</div> wieder außen</div>\n<DIV title="a>b">groß</DIV>\n<!-- <div>auskommentiert</div> -->',presets:[[tx('genügsam','lazy'),'<div>.*?</div>','gs'],[tx('gierig','greedy'),'<div>.*</div>','gs'],[tx('Tags entfernen (naiv)','strip tags (naive)'),'<[^>]+>','g']]},
 rule:tx('Für HTML einen Parser: <code>new DOMParser().parseFromString(html, \'text/html\')</code> und dann <code>querySelectorAll</code>. Für reinen Text: <code>doc.body.textContent</code>.','For HTML use a parser: <code>new DOMParser().parseFromString(html, \'text/html\')</code> and then <code>querySelectorAll</code>. For plain text: <code>doc.body.textContent</code>.'),
 links:[mdn('../API/DOMParser')]}),

{id:'whennot',cat:'pitfalls',title:tx('Wann keine Regex?','When not to use a regex'),sub:tx('Einfachere Werkzeuge','Simpler tools'),kind:'run',keys:'alternatives includes startswith split url intl when not to use regex',
 desc:tx('<p>Für viele Aufgaben gibt es eingebaute Funktionen, die schneller, lesbarer und richtiger sind. Eine Regex ist ein Werkzeug – nicht das einzige.</p>','<p>For many tasks there are built-in functions that are faster, more readable and more correct. A regex is a tool – not the only one.</p>'),
 vars:[
  [tx('Text enthalten','contains text'),R`const s = 'Bestellung storniert';
console.log(/storniert/.test(s), s.includes('storniert'));
console.log(/^Best/.test(s), s.startsWith('Best'));`,tx('includes/startsWith/endsWith: kein Escapen, keine Überraschungen.','includes/startsWith/endsWith: no escaping, no surprises.')],
  ['URL',R`const u = new URL('https://shop.example/suche?q=schuhe&seite=2#filter');
console.log(u.hostname, u.searchParams.get('q'), u.searchParams.get('seite'), u.hash);`,tx('URLs immer mit URL() zerlegen.','Always parse URLs with URL().')],
  [tx('Zahlen und Datum','numbers and dates'),R`console.log(new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(1234.5));
console.log(new Intl.DateTimeFormat('de-DE', { dateStyle: 'full' }).format(new Date(2026, 10, 13)));`,tx('Formatieren ist Sache von Intl, nicht von replace.','Formatting is Intl’s job, not replace’s.')],
  ['JSON',R`const text = '{"name":"Ada","tags":["a","b"]}';
console.log(JSON.parse(text).tags);`,tx('Strukturierte Daten nie mit Regex auslesen.','Never read structured data with a regex.')]
 ]},

X({id:'ex1',cat:'exercises',title:tx('Einsteiger','Beginner'),sub:tx('6 Aufgaben','6 tasks'),keys:'exercise practice beginner tasks',
 desc:tx('<p>Schreib ein Muster, das alle grünen Zeilen trifft und keine der anderen. Getestet wird mit <code>test()</code> – irgendwo in der Zeile reicht, außer die Aufgabe sagt „ganze Zeile“.</p>','<p>Write a pattern that matches every line marked “should match” and none of the others. It’s tested with <code>test()</code> – anywhere in the line is enough unless the task says “whole line”.</p>'),
 tasks:[
  {q:tx('Finde Zeilen, die das Wort „Fehler“ enthalten – egal ob groß oder klein.','Find lines that contain the word “error” – in any case.'),yes:tx(['Fehler in Zeile 3','FEHLER!','ein fehler'],['Error in line 3','ERROR!','an error']),no:tx(['Alles gut','Feh ler','F-e-h-l-e-r'],['All good','Err or','E-r-r-o-r']),sol:tx('fehler','error'),f:'i',hint:tx('Ein Flag hilft.','A flag helps.')},
  {q:tx('Treffe genau fünfstellige Postleitzahlen (ganze Zeile).','Match exactly five-digit postcodes (whole line).'),yes:['80331','01067','99999'],no:['8033','803310','8O331','PLZ 80331'],sol:R`^\d{5}$`,hint:tx(R`<code>\d</code>, ein Quantor in geschweiften Klammern und zwei Anker.`,R`<code>\d</code>, a quantifier in braces and two anchors.`)},
  {q:tx('Treffe „grau“ und „grey“ und „gray“, aber nicht „groy“.','Match “grau”, “grey” and “gray”, but not “groy”.'),yes:['grau','grey','gray'],no:['groy','gr y','grrey'],sol:'gr(?:au|ey|ay)',hint:tx('Alternativen in einer Gruppe – oder eine Klasse plus Alternativen.','Alternatives in a group – or a class plus alternatives.')},
  {q:tx('Finde Zeilen, die mit einer Ziffer beginnen.','Find lines that start with a digit.'),yes:['1. Punkt','42 Antworten','0 Fehler'],no:['Punkt 1','  3 eingerückt','x9'],sol:R`^\d`,hint:tx('Ein Anker und eine Kurzschreibweise.','An anchor and a shorthand.')},
  {q:tx('Treffe Hex-Farben mit genau 6 Hex-Ziffern nach dem # (ganze Zeile).','Match hex colours with exactly 6 hex digits after the # (whole line).'),yes:['#1f2e3d','#FFFFFF','#00aa00'],no:['#fff','1f2e3d','#1f2e3g','#1f2e3d4'],sol:'^#[0-9a-fA-F]{6}$',hint:tx('Eine Klasse mit drei Bereichen.','A class with three ranges.')},
  {q:tx('Treffe das Wort „Kat“ nur als eigenes Wort, nicht in „Katze“ oder „Kater“.','Match the word “cat” only as a word on its own, not in “category” or “concat”.'),yes:tx(['Kat','die Kat ist','Kat!'],['cat','the cat is','cat!']),no:tx(['Katze','Kater','Skat'],['category','concat','cats']),sol:tx(R`\bKat\b`,R`\bcat\b`),hint:tx('Wortgrenzen.','Word boundaries.')}
 ]}),

X({id:'ex2',cat:'exercises',title:tx('Fortgeschritten','Intermediate'),sub:tx('6 Aufgaben','6 tasks'),keys:'exercise practice intermediate tasks groups lookahead',
 desc:tx('<p>Hier brauchst du Gruppen, Quantoren und ein bisschen Nachdenken.</p>','<p>Here you need groups, quantifiers and a bit of thinking.</p>'),
 tasks:[
  {q:tx('Uhrzeiten von 00:00 bis 23:59 (ganze Zeile).','Times from 00:00 to 23:59 (whole line).'),yes:['00:00','09:30','23:59','19:05'],no:['24:00','9:30','23:60','12:5'],sol:R`^(?:[01]\d|2[0-3]):[0-5]\d$`,hint:tx('Die Stunden in zwei Fälle aufteilen: 00–19 und 20–23.','Split the hours into two cases: 00–19 and 20–23.')},
  {q:tx('Zeilen mit einem doppelten Wort (zweimal dasselbe Wort hintereinander).','Lines with a doubled word (the same word twice in a row).'),yes:tx(['das das','ist ist gut','Hallo hallo'],['the the','is is good','Hello hello']),no:tx(['das ist','dasdas','das dass'],['the then','thethe','is isn’t']),sol:R`\b(\w+)\s+\1\b`,f:'i',hint:tx('Eine Gruppe und ein Rückverweis. Groß/klein soll egal sein.','A group and a backreference. Case should not matter.')},
  {q:tx('Zeilen mit einem Euro-Preis wie „3,50 €“ oder „12 €“.','Prices in euros like “3,50 €” or “12 €”. Check: the line contains such a price.'),yes:['3,50 €','kostet 12 €','0,99 € pro Stück'],no:['3,50 $','12 Euro','€ 12'],sol:R`\d+(?:,\d{2})? €`,hint:tx('Optionale Gruppe für die Cent.','Optional group for the cents.')},
  {q:tx('Ganze Zeile: ein Kennzeichen wie „M AB 1234“ – 1–3 Großbuchstaben, Leerzeichen, 1–2 Großbuchstaben, Leerzeichen, 1–4 Ziffern.','Whole line: a plate like “M AB 1234” – 1–3 uppercase letters, space, 1–2 uppercase letters, space, 1–4 digits.'),yes:['M AB 1234','HH X 1','BAD KA 999'],no:['M AB 12345','m ab 123','MABC 12','M AB'],sol:R`^[A-Z]{1,3} [A-Z]{1,2} \d{1,4}$`,hint:tx('Drei Blöcke mit Bereichs-Quantoren.','Three blocks with range quantifiers.')},
  {q:tx('Zeilen, die „Test“ enthalten, aber nicht „Testat“.','Lines that contain “test” but not “testament”.'),yes:tx(['Test','Testlauf','ein Test'],['test','testing','a test']),no:tx(['Testat','Testate'],['testament','testaments']),sol:tx('Test(?!at)','test(?!ament)'),hint:tx('Negativer Lookahead.','Negative lookahead.')},
  {q:tx('Ganze Zeile: eine Zahl mit optionalem Minus und optionalen Nachkommastellen mit Punkt.','Whole line: a number with optional minus and optional decimals with a dot.'),yes:['42','-7','3.14','-0.5'],no:['3.','.5','--1','1.2.3','abc'],sol:R`^-?\d+(?:\.\d+)?$`,hint:tx('Das Minus ist optional, der Nachkommateil eine optionale Gruppe.','The minus is optional, the decimal part an optional group.')}
 ]}),

X({id:'ex3',cat:'exercises',title:tx('Profi','Expert'),sub:tx('5 Aufgaben','5 tasks'),keys:'exercise practice expert tasks lookahead backreference',
 desc:tx('<p>Lookarounds, Rückverweise und Muster, die auf das Ganze achten.</p>','<p>Lookarounds, backreferences and patterns that care about the whole.</p>'),
 tasks:[
  {q:tx('Passwort (ganze Zeile): mindestens 10 Zeichen, mindestens eine Ziffer und ein Sonderzeichen aus !?#@.','Password (whole line): at least 10 characters, at least one digit and one special character from !?#@.'),yes:['geheimnis1!','1234567890#','x9@xxxxxxxx'],no:['geheimnis!!','geheimnis11','kurz1!','geheimnis1'],sol:R`^(?=.*\d)(?=.*[!?#@]).{10,}$`,hint:tx('Zwei Lookaheads am Anfang, dann die Länge.','Two lookaheads at the start, then the length.')},
  {q:tx('Palindrome aus genau fünf Buchstaben (ganze Zeile), z. B. „Rotor“ – Groß/klein egal.','Palindromes of exactly five letters (whole line), e.g. “level” – case insensitive.'),yes:tx(['Rotor','radar','Kajak'],['level','radar','Kayak']),no:tx(['Roter','radau','Kajaks'],['lever','radio','Kayaks']),sol:R`^(\w)(\w)\w\2\1$`,f:'i',hint:tx('Zwei Gruppen am Anfang, zwei Rückverweise am Ende – in umgekehrter Reihenfolge.','Two groups at the start, two backreferences at the end – in reverse order.')},

/* Syntax-Hervorhebung für JS – bewusst klein: Kommentare, Strings, Zahlen, Schlüsselwörter */
const KW=new Set('const let var function return if else for of in while do new class extends this async await try catch finally throw typeof instanceof null undefined true false break continue switch case default delete void yield static super import export from'.split(' '));
function hlJS(src){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?n?\b)|([A-Za-z_$][\w$]*)/g;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[0];
    out+=m[1]?`<span class="tk-c">${esc(t)}</span>`:m[2]?`<span class="tk-s">${esc(t)}</span>`:m[3]?`<span class="tk-n">${esc(t)}</span>`:KW.has(t)?`<span class="tk-k">${esc(t)}</span>`:esc(t);
    last=re.lastIndex;
  }
  return out+esc(src.slice(last));
}
/* Code mit Markierung: ⟦…⟧ im Text wird hervorgehoben, alles andere escaped */
const mark=s=>esc(s).replace(/⟦([\s\S]*?)⟧/g,'<span class="ca-hl">$1</span>');

/* Wasserfall-Diagramm: rows = [[Label, [[Phase, ms], …], Start-ms]] */
const PH={dns:'DNS',tcp:'TCP',tls:'TLS',wait:tx('Warten','Waiting'),ttfb:tx('Anfrage → erstes Byte','Request → first byte'),dl:'Download',parse:tx('Parsen & Kompilieren','Parse & compile'),exec:tx('Ausführen','Execute'),render:tx('Rendern','Render'),block:tx('Blockiert','Blocked')};
function waterfall(rows,phases){
  const ends=rows.map(([,segs,start=0])=>start+segs.reduce((s,[,ms])=>s+ms,0)),max=Math.max(...ends,1);
  return `<div class="wf" role="img" aria-label="${tx('Zeitachse der Anfragen','Request timeline')}">${rows.map(([lbl,segs,start=0],i)=>{let t=start;return `<div class="wf-row"><span class="wf-lbl">${esc(lbl)}</span><span class="wf-track">${segs.filter(([,ms])=>ms>0).map(([ph,ms])=>{const h=`<span class="wf-seg ph-${ph}" style="left:${t/max*100}%;width:${ms/max*100}%" title="${PH[ph]}: ${Math.round(ms)} ms"></span>`;t+=ms;return h}).join('')}</span><span class="wf-t">${Math.round(ends[i])} ms</span></div>`}).join('')}</div>
  <ul class="wf-legend">${phases.map(p=>`<li><i class="ph-${p}"></i>${PH[p]}</li>`).join('')}</ul>`;
}

/* Werte wie in den DevTools ausgeben: Strings oben ohne, verschachtelt mit Anführungszeichen */
function fmt(v,top=true,depth=0){
  if(v===globalThis)return 'Window {…}';
  if(typeof v==='string')return top?v:`'${v}'`;
  if(v===undefined)return 'undefined';
  if(v===null)return 'null';
  if(typeof v==='number')return Object.is(v,-0)?'-0':String(v);
  if(typeof v==='bigint')return v+'n';
  if(typeof v!=='object'&&typeof v!=='function')return String(v);
  if(typeof v==='function')return `ƒ ${v.name||tx('(anonym)','(anonymous)')}()`;
  if(v instanceof Error)return `${v.name}: ${v.message}`;
  if(v instanceof Promise)return 'Promise {…}';
  if(depth>2)return Array.isArray(v)?'[…]':'{…}';
  if(Array.isArray(v))return `[${v.map(x=>fmt(x,false,depth+1)).join(', ')}]`;
  if(v instanceof Map)return `Map(${v.size}) {${[...v].map(([k,x])=>fmt(k,false,depth+1)+' => '+fmt(x,false,depth+1)).join(', ')}}`;
  if(v instanceof Set)return `Set(${v.size}) {${[...v].map(x=>fmt(x,false,depth+1)).join(', ')}}`;
  if(v instanceof Date)return v.toISOString();
  const proto=Object.getPrototypeOf(v),name=proto&&proto!==Object.prototype&&proto.constructor?proto.constructor.name+' ':'';
  return `${name}{${Object.keys(v).map(k=>`${/^[A-Za-z_$][\w$]*$/.test(k)?k:`'${k}'`}: ${fmt(v[k],false,depth+1)}`).join(', ')}}`;
}

/* Konsole: eine Liste, in die Demos schreiben. token sorgt dafür, dass alte Timer nach einem
   Neustart nicht mehr in die neue Ausgabe schreiben. */
function makeConsole(ol,timed){
  let token=0,t0=0;
  const api={
    reset(){token++;t0=performance.now();ol.innerHTML='';return token},
    add(type,args,tok=token){
      if(tok!==token)return;
      const li=document.createElement('li');li.className='con-'+type;
      if(timed){const t=document.createElement('span');t.className='con-t';t.textContent=Math.round((performance.now()-t0)/10)*10+' ms';li.append(t)}
      const m=document.createElement('span');m.textContent=args.map(a=>fmt(a)).join(' ');li.append(m);
      ol.append(li);
    },
    bound(tok){const a=(type)=>(...x)=>api.add(type,x,tok);return {log:a('log'),info:a('log'),warn:a('warn'),error:a('error')}}
  };
  return api;
}
const consoleHTML=(label=tx('Konsole','Console'))=>`<div class="console"><p class="console-h">${label}</p><ol class="con-lines" role="log" aria-label="${label}" data-empty="${tx('(noch keine Ausgabe)','(no output yet)')}"></ol></div>`;

/* run: Code-Varianten, die wirklich ausgeführt werden. Der Code läuft in einer async-Funktion,
   darum geht await auf oberster Ebene. sleep(ms) steht als Hilfsfunktion bereit. */
KINDS.run={
  html:e=>`${e.vars.length>1?`<fieldset class="ca-vals"><legend class="sr-only">${tx('Variante wählen','Choose a variant')}</legend>${e.vars.map((v,i)=>`<label><input type="radio" name="v-${e.id}" value="${i}"${i===(e.def||0)?' checked':''}>${v[0]}</label>`).join('')}</fieldset>`:''}
  <div class="ca-codebox"><pre class="code" tabindex="0" role="region" aria-label="${tx('Code','Code')}"><code></code></pre>
  <div class="run-bar"><button type="button" class="btn btn-primary btn-sm run-go">${ic('play2')}${tx('Ausführen','Run')}</button><span class="run-hint">${e.timed?tx('Die Zeit links zeigt, wann eine Zeile kam.','The time on the left shows when a line arrived.'):tx('Läuft echt in deinem Browser.','Runs for real in your browser.')}</span></div></div>
  ${consoleHTML()}<p class="ca-note" hidden></p>`,
  init(art,e){
    const con=makeConsole($('.con-lines',art),e.timed);
    let cur=e.def||0;
    const show=i=>{
      cur=i;const [,code,note]=e.vars[i];
      $('pre code',art).innerHTML=hlJS(code);
      const n=$('.ca-note',art);n.hidden=!note;n.innerHTML=note||'';
      run();
    };
    function run(){
      const tok=con.reset(),c=con.bound(tok),code=e.vars[cur][1];
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));
      let fn;
      try{fn=new Function('console','sleep',`return (async()=>{\n${code}\n})()`)}
      catch(err){con.add('error',[`SyntaxError: ${err.message}`],tok);return}
      fn(c,sleep).catch(err=>con.add('error',['Uncaught '+(err instanceof Error?`${err.name}: ${err.message}`:fmt(err,false))],tok));
    }
    art.addEventListener('change',ev=>{if(ev.target.name===`v-${e.id}`)show(+ev.target.value)});
    $('.run-go',art).addEventListener('click',run);
    show(cur);
    return ()=>con.reset();
  }
};

/* trace: Event Loop Schritt für Schritt. Ein Schritt ist [Zeile, Operationen, Erklärung].
   Operationen, durch ; getrennt: s+X / s- (Call Stack), a+X / a-X (Web APIs), m+X / m- (Microtasks),
   t+X / t- (Tasks), r+X / r- (Frame-Callbacks), o X (Konsole). Der Zustand wird für jeden Schritt aus
   allen vorherigen neu berechnet – so geht auch „zurück“ ohne Sonderfälle. */
function trState(e,n){
  const s={stack:[],api:[],micro:[],task:[],raf:[],out:[],line:0,note:e.start||tx('Drück „Weiter“, um den Code Schritt für Schritt laufen zu lassen.','Press “Next” to run the code step by step.'),fresh:new Set()};
  const key={s:'stack',a:'api',m:'micro',t:'task',r:'raf'};
  for(let i=0;i<n;i++){
    const [line,ops,note]=e.steps[i];s.line=line;s.note=note;s.fresh=new Set();
    (ops||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(op=>{
      if(op.startsWith('o ')){s.out.push(op.slice(2));s.fresh.add('out:'+op.slice(2));return}
      const L=s[key[op[0]]],arg=op.slice(2).trim();
      if(op[1]==='+'){L.push(arg);s.fresh.add(key[op[0]]+':'+arg)}
      else if(op[0]==='s')L.pop();
      else if(op[0]==='a'){const i=L.indexOf(arg);if(i>=0)L.splice(i,1)}
      else L.shift();
    });
  }
  return s;
}
KINDS.trace={
  html:e=>{
    const box=(k,cls,title)=>`<section class="tr-box ${cls}" aria-label="${title}"><h3>${title}</h3><ol data-k="${k}"></ol></section>`;
    return `<div class="tr">
    <div class="ca-codebox tr-code"><pre class="code" tabindex="0" role="region" aria-label="Code"><code>${e.code.split('\n').map((l,i)=>`<span class="ln" data-n="${i+1}">${hlJS(l)||' '}</span>`).join('')}</code></pre></div>
    <div class="tr-boxes">${box('stack','tr-stack','Call Stack')}${box('api','tr-api','Web APIs')}${box('micro','tr-micro',tx('Microtask-Queue','Microtask queue'))}${box('task','tr-task',tx('Task-Queue','Task queue'))}${e.raf?box('raf','tr-raf',tx('Vor dem nächsten Frame','Before next frame')):''}${box('out','tr-out',tx('Konsole','Console'))}</div>
    <p class="tr-note" aria-live="polite"></p>
    <div class="tr-bar"><span class="tr-pos"></span><button type="button" class="btn btn-secondary btn-sm tr-reset">${ic('refresh')}${tx('Von vorn','Restart')}</button><button type="button" class="btn btn-secondary btn-sm tr-prev">${ic('back')}${tx('Zurück','Back')}</button><button type="button" class="btn btn-primary btn-sm tr-next">${tx('Weiter','Next')}${ic('fwd')}</button><button type="button" class="btn btn-secondary btn-sm tr-play" aria-pressed="false">${ic('play2')}<span>${tx('Abspielen','Play')}</span></button></div>
    </div>`;
  },
  init(art,e){
    let n=0,timer=null;const N=e.steps.length;
    function draw(){
      const s=trState(e,n);
      $$('.tr-code .ln',art).forEach((l,i)=>l.classList.toggle('is-cur',i+1===s.line));
      ['stack','api','micro','task','raf','out'].forEach(k=>{
        const ol=$(`ol[data-k="${k}"]`,art);if(!ol)return;
        ol.innerHTML=s[k].map(x=>`<li${s.fresh.has(k+':'+x)?' class="is-new"':''}>${esc(x)}</li>`).join('');
      });
      $('.tr-note',art).innerHTML=s.note;
      $('.tr-pos',art).textContent=tx(`Schritt ${n} von ${N}`,`Step ${n} of ${N}`);
      $('.tr-prev',art).disabled=n===0;$('.tr-next',art).disabled=n===N;
      if(n===N)stop();
    }
    function stop(){clearInterval(timer);timer=null;const b=$('.tr-play',art);b.setAttribute('aria-pressed','false');$('span',b).textContent=tx('Abspielen','Play')}
    $('.tr-next',art).addEventListener('click',()=>{if(n<N){n++;draw()}});
    $('.tr-prev',art).addEventListener('click',()=>{if(n>0){n--;draw()}});
    $('.tr-reset',art).addEventListener('click',()=>{stop();n=0;draw()});
    $('.tr-play',art).addEventListener('click',ev=>{
      const b=ev.currentTarget;
      if(timer){stop();return}
      if(n===N)n=0;
      b.setAttribute('aria-pressed','true');$('span',b).textContent=tx('Anhalten','Pause');
      timer=setInterval(()=>{n++;draw()},reducedMotion()?1800:1200);draw();
    });
    draw();
    return ()=>clearInterval(timer);
  }
};

/* sim: Regler setzen, run(state) berechnet Urteil, Nachrichten und Ablauf.
   Rückgabe: {v:'ok'|'bad'|'warn'|'info', verdict, panes:[{t, code}], flow:[[status, html]], html} */
function ctlHTML(e,c){
  const id=`c-${e.id}-${c.k}`;
  if(c.type==='radio')return `<fieldset class="sim-f"><legend>${c.label}</legend><div class="ca-vals">${c.opts.map(([v,l])=>`<label><input type="radio" name="${id}" value="${esc(v)}"${v===c.def?' checked':''}>${l}</label>`).join('')}</div></fieldset>`;
  if(c.type==='checks')return `<fieldset class="sim-f"><legend>${c.label}</legend><div class="sim-checks">${c.opts.map(([v,l,on])=>`<label class="check-row"><input type="checkbox" name="${id}" value="${esc(v)}"${on?' checked':''}>${l}</label>`).join('')}</div></fieldset>`;
  if(c.type==='range')return `<div class="sim-range"><label class="sim-lbl" for="${id}">${c.label}</label><input type="range" id="${id}" name="${id}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.def}"><output for="${id}"></output></div>`;
  if(c.type==='select')return `<div class="field"><label class="sim-lbl" for="${id}">${c.label}</label><select id="${id}" name="${id}">${c.opts.map(([v,l])=>`<option value="${esc(v)}"${v===c.def?' selected':''}>${l}</option>`).join('')}</select></div>`;
  return `<div class="field"><label class="sim-lbl" for="${id}">${c.label}</label><input class="input" id="${id}" name="${id}" value="${esc(c.def||'')}" spellcheck="false" autocomplete="off"></div>`;
}
const VIC={ok:'ok',bad:'xc',warn:'alert',info:'info'};
function simOut(r){
  return `${r.verdict?`<p class="verdict v-${r.v||'info'}">${ic(VIC[r.v||'info'])}<span>${r.verdict}</span></p>`:''}
  ${r.panes&&r.panes.length?`<div class="panes">${r.panes.map(p=>`<figure class="pane"><figcaption>${p.t}</figcaption><pre class="code"><code>${p.code}</code></pre></figure>`).join('')}</div>`:''}
  ${r.flow&&r.flow.length?`<ol class="flow">${r.flow.map(([s,h])=>`<li class="fl-${s}"><span>${h}</span></li>`).join('')}</ol>`:''}
  ${r.html?`<div class="sim-extra">${r.html}</div>`:''}`;
}
KINDS.sim={
  html:e=>`<div class="sim-ctl">${e.ctl.map(c=>ctlHTML(e,c)).join('')}</div><div class="sim-out"></div>`,
  init(art,e){
    const read=()=>Object.fromEntries(e.ctl.map(c=>{
      const id=`c-${e.id}-${c.k}`;
      if(c.type==='radio')return [c.k,$(`input[name="${id}"]:checked`,art)?.value];
      if(c.type==='checks')return [c.k,Object.fromEntries(c.opts.map(([v])=>[v,$(`input[name="${id}"][value="${v}"]`,art).checked]))];
      const el=$('#'+id,art);
      if(c.type==='range'){const v=+el.value;$(`output[for="${id}"]`,art).textContent=c.fmt?c.fmt(v):v+(c.unit||'');return [c.k,v]}
      return [c.k,el.value];
    }));
    const out=$('.sim-out',art);
    const upd=()=>{out.innerHTML=simOut(e.run(read()));e.after?.(out)};
    $('.sim-ctl',art).addEventListener('input',upd);
    $('.sim-ctl',art).addEventListener('change',upd);

  }
};

  ['algo-visualizer',tx('Algorithmen-Visualizer','Algorithm Visualizer'),tx('Sortieren, Suchen und Graphen Schritt für Schritt.','Sorting, searching and graphs step by step.')]
].filter(([id])=>id!==APP.slug);
const sistersHTML=()=>`<div class="start-grid sisters">${SISTERS.map(([id,name,d])=>`<div class="tile"><h3><img class="sis-ic" src="https://daniel-hopium.github.io/${id}/favicon.svg" alt="" width="24" height="24"> ${name}</h3><p>${d}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/${id}/?lang=${LANG}">${tx(`${name} öffnen`,`Open ${name}`)}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div>`).join('')}</div>`;

function startHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Überblick','Overview')}</p>
  <h1 id="lesson-title" tabindex="-1">${APP.tagline}</h1>
  <p class="rule">${APP.intro}</p>
  <div class="start-grid">${CATS.map(c=>{const n=ENTRIES.filter(e=>e.cat===c.id).length;return `<div class="tile"><h3>${c.title}</h3><p>${c.intro}</p><a class="btn btn-secondary" href="#${c.id}">${nEntries(n)}<span class="sr-only"> ${tx('in','in')} ${plain(c.title)}</span></a></div>`}).join('')}</div>
  <h2>${tx('Alle Einträge','All entries')}</h2>
  <div class="field ca-find"><label for="ca-q">${tx('Eintrag suchen','Search entries')} <span class="opt">${tx('Name oder Stichwort','name or keyword')}</span></label><input class="input" id="ca-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ca-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${tx('Alle Einträge','All entries')}"><table class="table ca-index"><caption class="sr-only">${tx('Alle Einträge','All entries')}</caption><thead><tr><th scope="col">${tx('Eintrag','Entry')}</th><th scope="col">${tx('Worum es geht','What it is about')}</th><th scope="col">${tx('Kapitel','Chapter')}</th></tr></thead><tbody>${ENTRIES.map(e=>`<tr data-q="${esc(norm(`${plain(e.title)} ${plain(e.sub||'')} ${plain(CAT_BY[e.cat].title)} ${e.keys||''} ${plain(e.desc)}`))}"><td><a href="#${e.cat}/${e.id}">${e.title}</a></td><td>${e.sub||''}</td><td>${CAT_BY[e.cat].title}</td></tr>`).join('')}</tbody></table></div>
  <h2>${tx('Die Schwester-Apps','The sister apps')}</h2>
  ${sistersHTML()}
  <nav class="pager" aria-label="${tx('Weiter','Next')}"><a class="next" href="#${CATS[0].id}"><small>${tx('Erstes Kapitel →','First chapter →')}</small>${CATS[0].title}</a></nav>
</article>`;
}
function startInit(root){
  const q=$('#ca-q',root),rows=$$('tbody tr',root),count=$('#ca-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${ENTRIES.length} Einträgen`,`${n} of ${ENTRIES.length} entries`):nEntries(ENTRIES.length)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}

/* ---------- Seitenleiste ---------- */
const listEl=$('#list'),search=$('#q'),qStatus=$('#q-status');
let current=null,statusTimer=null;
function renderList(){
  const q=norm(search.value.trim());
  const hit=e=>!q||norm(`${plain(e.title)} ${plain(e.sub||'')} ${plain(CAT_BY[e.cat].title)} ${e.keys||''}`).includes(q);
  let html=q?'':`<ul class="items"><li><a class="item item-page" href="#start" data-id="start"><span class="item-title">${tx('Überblick','Overview')}</span><span class="item-short">${tx('Alle Kapitel und eine Tabelle aller Einträge.','All chapters and a table of all entries.')}</span></a></li></ul>`,count=0;
  CATS.forEach(c=>{
    const es=ENTRIES.filter(e=>e.cat===c.id&&hit(e));if(!es.length)return;count+=es.length;
    html+=`<a class="grp" id="grp-${c.id}" href="#${c.id}" data-id="${c.id}">${c.title}</a><ul class="items" aria-labelledby="grp-${c.id}">${es.map(e=>`<li><a class="item" href="#${c.id}/${e.id}" data-id="${c.id}/${e.id}"><span class="item-title">${e.title}</span></a></li>`).join('')}</ul>`;
  });
  if(q&&!count)html=`<div class="list-empty">${ic('search')}<p class="le-title">${tx(`Nichts zu „${esc(search.value.trim())}“`,`Nothing for “${esc(search.value.trim())}”`)}</p><p class="hint">${APP.searchHint}</p><button type="button" class="btn btn-secondary" id="q-reset">${tx('Suche zurücksetzen','Clear search')}</button></div>`;
  listEl.innerHTML=html;
  markActive(current,false);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{qStatus.textContent=q?tx(count===1?'1 Treffer':`${count} Treffer`,count===1?'1 result':`${count} results`):tx(`${ENTRIES.length} Einträge in ${CATS.length} Kapiteln`,`${ENTRIES.length} entries in ${CATS.length} chapters`)},q?450:0);
}
function markActive(id,reveal){
  $$('[data-id]',listEl).forEach(a=>{
    if(a.dataset.id===id){a.setAttribute('aria-current','page');if(reveal)a.scrollIntoView({block:'nearest'})}
    else a.removeAttribute('aria-current');
  });
}
search.addEventListener('input',renderList);
listEl.addEventListener('click',e=>{if(e.target.closest('#q-reset')){search.value='';renderList();search.focus()}});

/* ---------- Detailansicht ---------- */
const view=$('#view'),master=$('#master'),detail=$('#hauptinhalt'),shell=$('#shell');
let cleanup=null;
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> steht kein Eintrag. Vielleicht hat der Link einen Tippfehler.`,`There is no entry at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zum Überblick','Go to overview')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Eintrag suchen','Search entries')}</button></div>
  </div></article>`;
}
function updateTitle(base,sub){
  const c=CAT_BY[base],e=BY[sub];
  document.title=c?(e?`${plain(e.title)} · ${plain(c.title)} · ${APP.name}`:`${plain(c.title)} · ${APP.name}`):base==='start'?`${APP.name} – ${APP.tagline}`:tx(`Nicht gefunden · ${APP.name}`,`Not found · ${APP.name}`);
}
let masterScroll=0,lastId=null;
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  let [base,sub='']=id.split(/\/(.*)/);
  // Kurzform #eintrag springt zum Eintrag im richtigen Kapitel
  if(!CAT_BY[base]&&BY[base]){location.replace(`#${BY[base].cat}/${base}`);return}
  shell.dataset.view=overview?'master':'detail';
  let focusEl=null;
  if(overview||base==='start'){base='start';sub='';view.innerHTML=startHTML();cleanup=startInit(view)}
  else if(CAT_BY[base]){
    if(BY[sub]?.cat!==base)sub='';
    view.innerHTML=catHTML(base);cleanup=catInit(view,sub);
    focusEl=sub&&$('#ca-'+sub+'-h',view);
  }
  else{base=null;sub='';view.innerHTML=notFoundHTML(id)}
  withLang(view);
  current=base&&sub?`${base}/${sub}`:base;
  markActive(current,true);updateTitle(base,sub);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    if(!sub)detail.scrollTop=0;
    if(focusEl)focusEl.focus({preventScroll:true});else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&current)lastId=current;
}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Tastenkürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Sprachumschalter ----------
   Ein Link, kein Button: er führt zu einer anderen Adresse (?lang=…) und behält den Hash. Beschriftet in der
   Zielsprache selbst, mit lang-Attribut, damit Screenreader „English“ englisch aussprechen (WCAG 3.1.2). */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}

/* ---------- Start ---------- */
withLang(document);
updateLangLink();
renderList();
route(false);
})();
</script>
</body>
</html>
